name: Emergency VPS Runner Recovery (SSH-based)

# OPS BRANCH OVERRIDE — safe installer cleanup for disk recovery.
# Keeps: *-latest.exe, latest.yml (+ referenced desktop assets), last 2 versions.
# Does NOT touch Mongo, .env, live containers, or app source.

on:
  workflow_dispatch:
    inputs:
      cleanup_docker:
        description: 'Also prune Docker dangling images/builders'
        required: false
        default: 'yes'
        type: choice
        options: ['yes', 'no']

concurrency:
  group: krexion-vps-emergency-recovery
  cancel-in-progress: false

jobs:
  restart-runner:
    name: SSH safe disk cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH into VPS — safe installer cleanup
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 15m
          script: |
            set -e
            echo "===== BEFORE ====="
            df -h / | head -2
            du -sh /opt/krexion/downloads/windows /opt/krexion/downloads/desktop 2>/dev/null || true
            echo ""

            WIN_DIR=/opt/krexion/downloads/windows
            DESK_DIR=/opt/krexion/downloads/desktop
            KEEP_N=2

            echo "===== WINDOWS cleanup (keep latest + last ${KEEP_N}) ====="
            cd "$WIN_DIR"
            echo "size before: $(du -sh . | awk '{print $1}')"
            KEEP_LIST="Krexion-Setup-latest.exe"
            mapfile -t NEWEST < <(ls -1t Krexion-Setup-v*.exe 2>/dev/null | head -n "$KEEP_N")
            for f in "${NEWEST[@]}"; do KEEP_LIST="$KEEP_LIST $f"; done
            echo "KEEP: $KEEP_LIST"
            DELETED=0
            for f in Krexion-Setup-v*.exe; do
              [ -f "$f" ] || continue
              keep=0
              for k in $KEEP_LIST; do [ "$f" = "$k" ] && keep=1 && break; done
              if [ "$keep" = "0" ]; then rm -f -- "$f"; DELETED=$((DELETED+1)); fi
            done
            if [ ! -f Krexion-Setup-latest.exe ]; then
              NEWEST1=$(ls -1t Krexion-Setup-v*.exe 2>/dev/null | head -1 || true)
              [ -n "$NEWEST1" ] || { echo "ERROR: no Windows installer left"; exit 1; }
              cp -f "$NEWEST1" Krexion-Setup-latest.exe
            fi
            echo "windows deleted=$DELETED size_after=$(du -sh . | awk '{print $1}')"
            ls -lah

            echo ""
            echo "===== DESKTOP cleanup (keep latest.yml target + latest + last ${KEEP_N}) ====="
            cd "$DESK_DIR"
            echo "size before: $(du -sh . | awk '{print $1}')"
            KEEP_LIST="Krexion-Desktop-Setup-latest.exe latest.yml"
            if [ -f latest.yml ]; then
              YML_PATH=$(grep -E '^[[:space:]]*path:' latest.yml | head -1 | sed 's/.*path:[[:space:]]*//' | tr -d '"' | tr -d "'" | tr -d '\r')
              echo "latest.yml path: [$YML_PATH]"
              [ -n "$YML_PATH" ] && KEEP_LIST="$KEEP_LIST $YML_PATH ${YML_PATH}.blockmap"
            fi
            mapfile -t NEWEST < <(ls -1t Krexion-Desktop-Setup-*.exe 2>/dev/null | grep -v latest | head -n "$KEEP_N")
            for f in "${NEWEST[@]}"; do KEEP_LIST="$KEEP_LIST $f ${f}.blockmap"; done
            echo "KEEP: $KEEP_LIST"
            DELETED=0
            for f in Krexion-Desktop-Setup-*.exe Krexion-Desktop-Setup-*.exe.blockmap; do
              [ -f "$f" ] || continue
              keep=0
              for k in $KEEP_LIST; do [ "$f" = "$k" ] && keep=1 && break; done
              [ "$f" = "Krexion-Desktop-Setup-latest.exe" ] && keep=1
              if [ "$keep" = "0" ]; then rm -f -- "$f"; DELETED=$((DELETED+1)); fi
            done
            if [ ! -f Krexion-Desktop-Setup-latest.exe ]; then
              NEWEST1=$(ls -1t Krexion-Desktop-Setup-*.exe 2>/dev/null | grep -v latest | head -1 || true)
              [ -n "$NEWEST1" ] || { echo "ERROR: no Desktop installer left"; exit 1; }
              cp -f "$NEWEST1" Krexion-Desktop-Setup-latest.exe
            fi
            [ -f latest.yml ] || { echo "ERROR: latest.yml missing"; exit 1; }
            echo "desktop deleted=$DELETED size_after=$(du -sh . | awk '{print $1}')"
            ls -lah

            echo ""
            echo "===== Runner _work leftovers ====="
            if [ -d /opt/krexion-runner/_work ]; then
              echo "before: $(du -sh /opt/krexion-runner/_work | awk '{print $1}')"
              rm -rf /opt/krexion-runner/_work/*/* 2>/dev/null || true
              echo "after: $(du -sh /opt/krexion-runner/_work | awk '{print $1}')"
            fi

            if [ "${{ github.event.inputs.cleanup_docker }}" = "yes" ]; then
              echo ""
              echo "===== Light docker prune (dangling only) ====="
              docker image prune -f 2>&1 | tail -5 || true
              docker builder prune -f --keep-storage 5GB 2>&1 | tail -5 || true
            fi

            echo ""
            echo "===== AFTER ====="
            df -h / | head -2
            echo "downloads total: $(du -sh /opt/krexion/downloads 2>/dev/null | awk '{print $1}')"
            echo "windows: $(du -sh /opt/krexion/downloads/windows 2>/dev/null | awk '{print $1}')"
            echo "desktop: $(du -sh /opt/krexion/downloads/desktop 2>/dev/null | awk '{print $1}')"
            echo ""
            echo "===== VERIFY ====="
            test -f /opt/krexion/downloads/windows/Krexion-Setup-latest.exe && echo OK windows-latest || { echo FAIL windows-latest; exit 1; }
            test -f /opt/krexion/downloads/desktop/Krexion-Desktop-Setup-latest.exe && echo OK desktop-latest || { echo FAIL desktop-latest; exit 1; }
            test -f /opt/krexion/downloads/desktop/latest.yml && echo OK latest.yml || { echo FAIL latest.yml; exit 1; }
            # Ensure yml-referenced file still exists
            YML_PATH=$(grep -E '^[[:space:]]*path:' /opt/krexion/downloads/desktop/latest.yml | head -1 | sed 's/.*path:[[:space:]]*//' | tr -d '"' | tr -d "'" | tr -d '\r')
            if [ -n "$YML_PATH" ]; then
              test -f "/opt/krexion/downloads/desktop/$YML_PATH" && echo "OK yml-target $YML_PATH" || { echo "FAIL yml-target $YML_PATH"; exit 1; }
            fi
            echo "===== CLEANUP DONE: $(date -u +%FT%TZ) ====="

      - name: Skip runner poll (cleanup-only run)
        run: echo "Installer cleanup finished — runner poll skipped for this ops cleanup run."
