name: Sync Installer CDN

# Lightweight job — downloads installers from GitHub Releases to
# /opt/krexion/downloads/ on the VPS. Does NOT rebuild Docker.
# Use when mirror jobs hang or deploy times out before CDN sync.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_cdn_from_github_release.sh'
      - '.github/workflows/cdn-sync.yml'

concurrency:
  group: krexion-cdn-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Pull installers from GitHub Release → VPS CDN
    runs-on: [self-hosted, linux, krexion-vps]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          SHA="${{ github.sha }}"
          if [ ! -d .git ]; then git init && git remote add origin "$REPO"; else git remote set-url origin "$REPO"; fi
          git fetch --force origin "$SHA"
          git checkout --force --detach "$SHA"

      - name: Sync native + desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/sync_cdn_from_github_release.sh
          bash scripts/sync_cdn_from_github_release.sh

      - name: Verify CDN endpoints
        run: |
          VER=$(tr -d '[:space:]' < backend/VERSION)
          for URL in \
            "https://krexion.com/downloads/windows/Krexion-Setup-v${VER}.exe" \
            "https://krexion.com/downloads/desktop/Krexion-Desktop-Setup-${VER}.exe"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -I "$URL" || echo "000")
            echo "$URL → HTTP $CODE"
            [ "$CODE" = "200" ] || exit 1
          done
          echo "✅ CDN verified for v${VER}"
