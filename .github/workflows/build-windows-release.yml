name: Build Native Windows Release

# ========================================================================
# Krexion - Embedded-Python Windows build pipeline
# ========================================================================
# Uses the embedded-Python approach (same as Calibre, Anki, etc.) instead
# of PyInstaller/Nuitka compilation. ~99% first-try success rate.
# ========================================================================

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty for nightly build (no GH Release).'
        required: false
        default: ''
  # v1.0.18: auto-trigger on push to main whenever backend/VERSION
  # changes. Previously the Windows installer had to be manually
  # triggered from the Actions tab after every fix push, which led to
  # 2 separate failure modes on customer testing:
  #   1. Cloud deploy lands, customer reinstalls old installer →
  #      reports "still broken" because the desktop fix wasn't built.
  #   2. Admin forgets to dispatch the workflow at all → no new .exe
  #      gets cut for hours.
  # Trigger key = a change to backend/VERSION (single source of truth
  # the build itself reads). Tag derived from the version file so the
  # GitHub Release lands automatically without a manual tag input.
  push:
    branches: [main]
    paths:
      - 'backend/VERSION'
      - '.github/workflows/build-windows-release.yml'

# v2.6.55 — one native build at a time; cancel stale runs when a new
# perfect build is dispatched so the Windows runner isn't stuck behind
# doomed #194/#195 queue entries.
concurrency:
  group: krexion-native-build-${{ github.ref }}
  cancel-in-progress: false

# ----------------------------------------------------------------------
# `contents: write` is required by softprops/action-gh-release@v2 in the
# final "Create GitHub Release" step. Since 2023 GitHub ships repos with
# the default GITHUB_TOKEN scoped to read-only, so without this line the
# release step fails with:
#     HTTP 403 "Resource not accessible by integration"
# We grant the minimum permissions needed; everything else stays default
# (read-only), so workflows can still check out code and download deps.
# ----------------------------------------------------------------------
permissions:
  contents: write
  actions: read

jobs:
  build-backend:
    name: Bundle backend (embedded Python)
    # 2026-01-09 — switched from `windows-latest` (paid GH minutes) to
    # the customer's self-hosted Windows runner. Setup guide:
    # deployment/windows-runner/WINDOWS-RUNNER-GUIDE.md
    # If the Windows runner is offline, this job will queue until it
    # comes back — it will NOT fall back to `windows-latest` (that's a
    # cost-of-doing-business decision, not a runtime one).
    runs-on: [self-hosted, windows, krexion-windows]
    # v2.6.55 — backend bundle (pip install all wheels) takes 90+ min
    # on the self-hosted Windows runner; #191/#192 cancelled at 30/60m,
    # #193 at 90m ceiling.
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
      numeric_version: ${{ steps.version.outputs.numeric_version }}
    steps:
      - name: Checkout code via git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          SHA="${{ github.sha }}"
          # v2.7.131 — retry checkout; self-hosted Windows flakes on index.lock / fetch races
          rm -f .git/index.lock 2>/dev/null || true
          if [ ! -d .git ]; then
            git init
            git remote add origin "$REPO" || git remote set-url origin "$REPO"
          else
            git remote set-url origin "$REPO" || true
          fi
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "Checkout attempt $attempt for $SHA"
            rm -f .git/index.lock 2>/dev/null || true
            if git fetch --force --depth=1 origin "$SHA" \
              && git checkout --force --detach "$SHA" \
              && git reset --hard "$SHA"; then
              ok=1
              break
            fi
            echo "Checkout attempt $attempt failed — waiting $((attempt * 10))s"
            sleep $((attempt * 10))
            if [ "$attempt" -ge 3 ]; then
              echo "Re-init workspace after repeated checkout failure"
              find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} + 2>/dev/null || true
              rm -rf .git
              git init
              git remote add origin "$REPO"
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "FATAL: git checkout failed after retries"
            exit 1
          fi
          echo "Checked out $SHA"
          test "$(git rev-parse HEAD)" = "$SHA"


      - name: Windows disk self-heal (before embed build)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          function Show-Free([string]$label) {
            $d = Get-PSDrive -Name C -ErrorAction SilentlyContinue
            if ($d) {
              $gb = [math]::Round(($d.Free / 1GB), 2)
              Write-Host ("{0}: C: free {1} GB" -f $label, $gb)
              return $gb
            }
            return 0
          }
          $before = Show-Free 'BEFORE'
          # Runner diag logs (this run died writing Worker_*.log — disk full)
          @(
            'C:\krexion-runner\_diag',
            'C:\actions-runner\_diag',
            "$env:USERPROFILE\actions-runner\_diag",
            'C:\Windows\Temp',
            "$env:TEMP"
          ) | ForEach-Object {
            if (Test-Path $_) {
              Get-ChildItem $_ -File -ErrorAction SilentlyContinue |
                Where-Object { $_.LastWriteTime -lt (Get-Date).AddDays(-1) -or $_.Extension -in '.log','.tmp' } |
                Remove-Item -Force -ErrorAction SilentlyContinue
              Write-Host "Cleaned $_"
            }
          }
          # Old Native handoff caches (keep last 2 runs only)
          $runs = 'C:\krexion-ci-cache\runs'
          if (Test-Path $runs) {
            Get-ChildItem $runs -Directory -ErrorAction SilentlyContinue |
              Sort-Object CreationTime -Descending |
              Select-Object -Skip 2 |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Pruned old $runs (kept newest 2)"
          }
          # Stale deps caches older than 14 days
          $depsRoot = 'C:\krexion-ci-cache'
          if (Test-Path $depsRoot) {
            Get-ChildItem $depsRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like 'deps-v1-*' -and $_.LastWriteTime -lt (Get-Date).AddDays(-14) } |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }
          # Pip / Playwright / npm residue
          @(
            "$env:LOCALAPPDATA\pip\Cache",
            "$env:LOCALAPPDATA\Temp",
            "$env:USERPROFILE\.cache\pip"
          ) | ForEach-Object {
            if (Test-Path $_) {
              try { Remove-Item "$_\*" -Recurse -Force -ErrorAction SilentlyContinue } catch {}
              Write-Host "Cleared $_"
            }
          }
          # Empty recycle bin best-effort
          try { Clear-RecycleBin -Force -ErrorAction SilentlyContinue } catch {}
          $after = Show-Free 'AFTER'
          if ($after -lt 2.0) {
            Write-Host "::error::C: free space still under 2 GB after self-heal ($after GB). Free disk on the Windows runner, then re-run."
            exit 1
          }
          Write-Host "Disk self-heal OK ($after GB free)"


      - name: Compute version
        id: version
        shell: bash
        run: |
          # `version` = human/display tag - used for filenames, GitHub
          # Release title, and AppVersion in installer branding. Can be
          # anything (e.g. "v1.0.5", "nightly-20260602-1430").
          #
          # v1.0.18: auto-derive tag from backend/VERSION when the
          # workflow is push-triggered (no manual input). Falls back
          # to nightly only if VERSION is missing or empty.
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            VER="${{ github.event.inputs.release_tag }}"
          elif [ -f "backend/VERSION" ] && [ -s "backend/VERSION" ]; then
            FILE_VER=$(tr -d '[:space:]' < backend/VERSION)
            if [ -n "$FILE_VER" ]; then
              # Prepend `v` if not already present so the tag follows
              # the GitHub convention "v1.0.18" (matches existing tags).
              case "$FILE_VER" in
                v*) VER="$FILE_VER" ;;
                *)  VER="v$FILE_VER" ;;
              esac
            else
              VER="nightly-$(date +%Y%m%d-%H%M)"
            fi
          else
            VER="nightly-$(date +%Y%m%d-%H%M)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          # `numeric_version` = strict X.X.X.X (digits + dots, max 4
          # parts) - required by Inno Setup's VersionInfoVersion field
          # which feeds into the Windows EXE FILEVERSION resource.
          #
          # Why this is done with `awk` instead of `read`+IFS: the
          # GitHub Actions default `bash` is invoked with
          # `set -eo pipefail`, and `IFS='.' read -r A B C D <<<"$X"`
          # returns non-zero whenever the input has fewer than 4
          # fields (read hits EOF before filling D), which silently
          # kills the whole step.
          #
          # We use `*` instead of `{0,3}` so this works on both mawk
          # (Linux/macOS default) and gawk (Git Bash on Windows) -
          # mawk doesn't support ERE interval quantifiers without
          # `--re-interval`. We then cap the array to 4 parts after
          # splitting.
          #
          # Examples:
          #   v1.0.5            -> 1.0.5.0
          #   v2.0.0-beta1      -> 2.0.0.0
          #   1.0.5.10-rc2      -> 1.0.5.10
          #   1.2.3.4.5         -> 1.2.3.4    (extras dropped)
          #   nightly-20260602  -> 0.0.0.0
          #   v1                -> 1.0.0.0
          NUM4=$(echo "$VER" | awk '{
            if (match($0, /^v?[0-9]+(\.[0-9]+)*/)) {
              s = substr($0, RSTART, RLENGTH)
              sub(/^v/, "", s)
              n = split(s, a, ".")
              if (n > 4) n = 4
              for (i = n + 1; i <= 4; i++) a[i] = "0"
              printf "%s.%s.%s.%s", a[1], a[2], a[3], a[4]
            } else {
              printf "0.0.0.0"
            }
          }')
          echo "numeric_version=$NUM4" >> "$GITHUB_OUTPUT"
          echo "Display version : $VER"
          echo "Numeric version : $NUM4"

      # Self-hosted Windows runner is rate-limited on codeload.github.com
      # (HTTP 429) when GitHub Actions tries to download marketplace
      # action zips at "Set up job". This job must use ZERO `uses:`
      # steps. Host python only runs build-backend.py; that script
      # downloads its own embeddable CPython 3.11. pip cache already
      # persists on the runner disk.
      - name: Resolve host Python
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $py = $null
          $cmd = Get-Command python -ErrorAction SilentlyContinue
          if ($cmd) { $py = $cmd.Source }
          if (-not $py) {
            foreach ($p in @('C:\Python314\python.exe','C:\Python311\python.exe','C:\Python312\python.exe')) {
              if (Test-Path $p) { $py = $p; break }
            }
          }
          if (-not $py) { throw 'python.exe not found on the Windows runner PATH' }
          Write-Host "Host python: $py"
          & $py -c "import sys; print(sys.version)"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $py -Parent)
          Add-Content -Path $env:GITHUB_ENV -Value ('KREXION_PYTHON=' + $py)

      - name: Restore local FAST BUILD cache
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $ms = New-Object System.IO.MemoryStream
          foreach ($f in @('backend/requirements.txt', 'build/build-backend.py')) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $f))
            $ms.Write($bytes, 0, $bytes.Length)
          }
          $hash = ([BitConverter]::ToString($sha.ComputeHash($ms.ToArray()))).Replace('-','').ToLower().Substring(0,16)
          $cache = "C:\krexion-ci-cache\deps-v1-$hash"
          Add-Content -Path $env:GITHUB_ENV -Value ('KREXION_DEPS_CACHE=' + $cache)
          $core = Join-Path $cache 'krexion-backend.dist\krexion-core.exe'
          if (Test-Path $core) {
            New-Item -ItemType Directory -Force -Path build\dist | Out-Null
            $dest = 'build\dist\krexion-backend.dist'
            if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
            Copy-Item -Recurse -Force (Join-Path $cache 'krexion-backend.dist') $dest
            $fp = Join-Path $cache '.deps-fingerprint'
            if (Test-Path $fp) { Copy-Item $fp build\.deps-fingerprint -Force }
            Write-Host "Restored FAST BUILD cache from $cache"
          } else {
            Write-Host "No local FAST BUILD cache at $cache"
          }

      - name: Run embedded-Python build
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          $py = $env:KREXION_PYTHON
          if (-not $py) { $py = 'python' }
          & $py build/build-backend.py
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Build script returned exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Save local FAST BUILD cache + handoff to installer
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'build\dist\krexion-backend.dist'
          if (-not (Test-Path (Join-Path $src 'krexion-core.exe'))) {
            throw "krexion-core.exe missing after build"
          }
          if ($env:KREXION_DEPS_CACHE) {
            New-Item -ItemType Directory -Force -Path $env:KREXION_DEPS_CACHE | Out-Null
            $cacheDest = Join-Path $env:KREXION_DEPS_CACHE 'krexion-backend.dist'
            if (Test-Path $cacheDest) { Remove-Item -Recurse -Force $cacheDest }
            Copy-Item -Recurse -Force $src $cacheDest
            if (Test-Path 'build\.deps-fingerprint') {
              Copy-Item 'build\.deps-fingerprint' $env:KREXION_DEPS_CACHE\ -Force
            }
            Write-Host "Saved FAST BUILD cache to $env:KREXION_DEPS_CACHE"
          }
          $runDir = "C:\krexion-ci-cache\runs\$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $runDir | Out-Null
          $runDest = Join-Path $runDir 'krexion-backend.dist'
          if (Test-Path $runDest) { Remove-Item -Recurse -Force $runDest }
          Copy-Item -Recurse -Force $src $runDest
          Write-Host "Handoff copied to $runDest"
          Get-ChildItem 'C:\krexion-ci-cache\runs' -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.CreationTime -lt (Get-Date).AddDays(-3) } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Show build output (diagnostic)
        if: always()
        shell: powershell
        run: |
          if (Test-Path build/dist) {
            Write-Host "=== build/dist contents ==="
            Get-ChildItem build/dist -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length |
              Format-Table -AutoSize | Out-String -Width 200
            $size = (Get-ChildItem build/dist -Recurse -File -ErrorAction SilentlyContinue |
                     Measure-Object -Property Length -Sum).Sum
            Write-Host "Total size: $([math]::Round($size / 1MB, 1)) MB"
          } else {
            Write-Host "No build/dist directory was produced."
          }

      # Installer job reads the local C:\krexion-ci-cache handoff.

  build-frontend:
    name: Build React frontend
    # v2.6.56 — GitHub-hosted Linux so frontend builds IN PARALLEL with
    # VPS deploy on krexion-vps (one self-hosted runner = one job at a time).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        # GitHub-hosted ubuntu-latest may force Node 24; package.json
        # engines allow 20/22/24 and yarn uses --ignore-engines below.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable yarn via corepack
        # 2026-01-09 — self-hosted krexion-vps runner doesn't ship yarn
        # pre-installed (unlike GitHub-hosted ubuntu-latest). corepack
        # is bundled with Node 20 and can activate yarn v1 to match
        # our existing yarn.lock (lockfile v1 / Yarn Classic).
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Build production bundle
        run: |
          cd frontend
          yarn install --frozen-lockfile --ignore-engines
          echo "REACT_APP_BACKEND_URL=http://127.0.0.1:8001" > .env.production
          CI=false yarn build
          cd ..
          python3 scripts/stamp-frontend-build.py

      - name: Upload frontend artifact
        # Installer job downloads this via GitHub API (no actions/cache
        # on the self-hosted Windows runner — that zip hits 429).
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: krexion-frontend-build
          path: frontend/build
          retention-days: 3

  build-installer:
    name: Build Krexion-Setup.exe
    # 2026-01-09 — self-hosted Windows runner (see build-backend job).
    runs-on: [self-hosted, windows, krexion-windows]
    needs: [build-backend, build-frontend]
    if: always() && needs.build-backend.result == 'success' && needs.build-frontend.result == 'success'
    # Timeout raised from 30 -> 75 min in v1.0.10:
    # Bundling Playwright Chromium (~250 MB compressed inside the
    # installer) pushes Inno Setup's lzma2/ultra compression past the
    # previous 30-min budget. Build #22 hit the wall at minute 35 while
    # still inside the silent ISCC compile (12+ min on the chromium
    # folder alone). 75 min gives ~25-30 min of headroom even with
    # slow GitHub-hosted Windows runners.
    timeout-minutes: 90
    steps:
      - name: Checkout code via git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          SHA="${{ github.sha }}"
          # v2.7.131 — retry checkout; self-hosted Windows flakes on index.lock / fetch races
          rm -f .git/index.lock 2>/dev/null || true
          if [ ! -d .git ]; then
            git init
            git remote add origin "$REPO" || git remote set-url origin "$REPO"
          else
            git remote set-url origin "$REPO" || true
          fi
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "Checkout attempt $attempt for $SHA"
            rm -f .git/index.lock 2>/dev/null || true
            if git fetch --force --depth=1 origin "$SHA" \
              && git checkout --force --detach "$SHA" \
              && git reset --hard "$SHA"; then
              ok=1
              break
            fi
            echo "Checkout attempt $attempt failed — waiting $((attempt * 10))s"
            sleep $((attempt * 10))
            if [ "$attempt" -ge 3 ]; then
              echo "Re-init workspace after repeated checkout failure"
              find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} + 2>/dev/null || true
              rm -rf .git
              git init
              git remote add origin "$REPO"
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "FATAL: git checkout failed after retries"
            exit 1
          fi
          echo "Checked out $SHA"
          test "$(git rev-parse HEAD)" = "$SHA"

      # Same 429 rule as build-backend: ZERO marketplace `uses:` on
      # this self-hosted Windows job. Backend handoff is a local copy
      # on C:\krexion-ci-cache (same PC). Frontend comes from the
      # ubuntu-latest artifact via the GitHub API (api.github.com, not
      # codeload), with a local yarn rebuild fallback.
      - name: Restore backend bundle from local handoff
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = "C:\krexion-ci-cache\runs\$env:GITHUB_RUN_ID\krexion-backend.dist"
          $core = Join-Path $src 'krexion-core.exe'
          if (-not (Test-Path $core)) {
            throw "Backend handoff missing at $src"
          }
          New-Item -ItemType Directory -Force -Path build\dist | Out-Null
          $dest = 'build\dist\krexion-backend.dist'
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Copy-Item -Recurse -Force $src $dest
          Write-Host "Restored backend bundle from $src"

      - name: Download frontend artifact via GitHub API
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = 'application/vnd.github+json'
            'User-Agent'  = 'krexion-native'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=50"
          $arts = Invoke-RestMethod -Uri $uri -Headers $headers
          $art = $arts.artifacts | Where-Object { $_.name -eq 'krexion-frontend-build' -and -not $_.expired } | Select-Object -First 1
          if (-not $art) {
            Write-Host "No krexion-frontend-build artifact on this run; local rebuild fallback will run"
            exit 0
          }
          $zip = Join-Path $env:TEMP 'krexion-frontend-build.zip'
          Write-Host "Downloading frontend artifact id=$($art.id) size=$($art.size_in_bytes)"
          Invoke-WebRequest -Uri $art.archive_download_url -Headers $headers -OutFile $zip -UseBasicParsing -TimeoutSec 300
          $dest = 'frontend\build'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          if (-not (Test-Path "$dest\index.html") -and (Test-Path "$dest\build\index.html")) {
            Copy-Item -Recurse -Force "$dest\build\*" $dest
          }
          if (Test-Path "$dest\index.html") {
            Write-Host "Frontend artifact extracted to $dest"
          } else {
            Write-Host "Frontend zip extracted but index.html missing; local rebuild fallback will run"
          }

      - name: Stamp and verify frontend artifact
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          & ./scripts/stamp-frontend-build.ps1

      - name: Build frontend locally (bulletproof fallback if cache + artifact both fail)
        # 2026-01-09 — when GitHub Actions artifact quota is exhausted
        # AND cache save/restore has any hiccup (cross-runner, cross-OS),
        # both prior steps silently fail. Rather than hard-fail the
        # installer at "Verify build outputs", just rebuild the frontend
        # locally here on the Windows runner. Costs ~4 min only when
        # actually needed — the Test-Path check skips otherwise.
        #
        # 2026-02-10 (v2.5.1) — the `yarn build` script in
        # frontend/package.json is defined as `CI=false craco build`,
        # which is Unix-style inline env-var syntax. On Windows
        # PowerShell that fails instantly with:
        #     'CI' is not recognized as an internal or external command
        # We must set $env:CI = 'false' in PowerShell BEFORE invoking
        # yarn build, otherwise the fallback rebuild aborts in ~70ms
        # and the installer job fails at "Upload installer artifact"
        # with "No files were found" (root cause of build #139 failure).
        #
        # Also add strict $LASTEXITCODE gates so a silent yarn error
        # doesn't get swallowed by PowerShell's default Continue mode
        # (which was masking the CI=false failure until now).
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Test-Path "frontend/build/index.html") -or (Test-Path "build/frontend-build/index.html")) {
            Write-Host "Frontend already available from artifact - skipping local rebuild"
            exit 0
          }
          Write-Host "Frontend missing from cache AND artifact - rebuilding locally..."
          cd frontend
          yarn install --frozen-lockfile --ignore-engines
          if ($LASTEXITCODE -ne 0) { throw "yarn install failed with exit $LASTEXITCODE" }
          "REACT_APP_BACKEND_URL=http://127.0.0.1:8001" | Out-File -FilePath .env.production -Encoding ASCII
          # v2.5.1 — DO NOT use `yarn build`. The build script in
          # frontend/package.json is `CI=false craco build` (Unix
          # inline env var syntax). Yarn passes that raw string to
          # cmd.exe on Windows which errors instantly with:
          #   'CI' is not recognized as an internal or external command
          # Fix: set CI in the PowerShell environment (inherited by
          # craco) and invoke craco directly via its local .bin shim,
          # bypassing the broken package.json script entirely.
          $env:CI = 'false'
          $env:GENERATE_SOURCEMAP = 'false'
          $craco = ".\node_modules\.bin\craco.cmd"
          if (-not (Test-Path $craco)) { $craco = ".\node_modules\.bin\craco" }
          if (-not (Test-Path $craco)) { throw "craco binary not found under node_modules/.bin/ -- yarn install may be incomplete" }
          & $craco build
          if ($LASTEXITCODE -ne 0) { throw "craco build failed with exit $LASTEXITCODE" }
          if (-not (Test-Path "build/index.html")) {
            throw "craco build reported success but build/index.html is missing"
          }
          cd ..
          & ./scripts/stamp-frontend-build.ps1
          Write-Host "Local frontend build complete."

      - name: Verify build outputs available
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $backendOk = Test-Path "build/dist/krexion-backend.dist/krexion-core.exe"
          if (-not $backendOk) { throw "Backend build artifact missing from BOTH cache and artifact." }
          if (-not (Test-Path "frontend/build/index.html")) { throw "Frontend build artifact missing from BOTH cache and artifact." }

          # Always refresh installer-facing bundle from the ubuntu artifact.
          # Self-hosted runner can keep a stale build/frontend-build folder
          # between runs which previously made verify/stamp fail instantly.
          if (Test-Path "build/frontend-build") {
            Remove-Item -Recurse -Force "build/frontend-build"
          }
          New-Item -ItemType Directory -Force -Path "build/frontend-build" | Out-Null
          Copy-Item -Recurse -Force frontend/build/* build/frontend-build/

          $expected = (Get-Content backend/VERSION -Raw).Trim().TrimStart('v','V')
          $stampFile = "build/frontend-build/build-version.json"
          $needsStamp = $true
          if (Test-Path $stampFile) {
            try {
              $got = ((Get-Content $stampFile -Raw | ConvertFrom-Json).version).ToString().Trim().TrimStart('v','V')
              if ($got -eq $expected) { $needsStamp = $false }
            } catch {
              $needsStamp = $true
            }
          }
          if ($needsStamp) {
            & ./scripts/stamp-frontend-build.ps1 -Dir "build/frontend-build"
          } else {
            Write-Host "Frontend bundle already stamped for v$expected"
          }

          if (-not (Test-Path "build/frontend-build/index.html")) {
            throw "Normalized frontend bundle missing index.html"
          }
          Write-Host "backend OK: $backendOk"
          Write-Host "frontend OK: true"

      - name: Download MongoDB Portable
        shell: powershell
        run: |
          # MongoDB Portable from MongoDB Inc.'s own CDN. Generally
          # rock-solid, but we wrap it in a 3-attempt retry loop just in
          # case the runner hits a transient TLS/DNS hiccup or fastdl
          # has a regional outage. ~700 MB download = the heaviest step
          # in the whole workflow, so we don't want a one-off blip to
          # waste 13 minutes of build time.
          $url = "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-7.0.14.zip"
          $maxAttempts = 3
          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
              Write-Host "Attempt $i of $maxAttempts : downloading MongoDB Portable..."
              Invoke-WebRequest -Uri $url -OutFile build/mongo.zip -UseBasicParsing -TimeoutSec 900
              break
            } catch {
              Write-Warning "Attempt $i failed: $($_.Exception.Message)"
              if ($i -eq $maxAttempts) { throw }
              Start-Sleep -Seconds (10 * $i)
            }
          }
          Expand-Archive -Path build/mongo.zip -DestinationPath build/mongo-extract -Force
          $srcDir = Get-ChildItem build/mongo-extract -Filter "mongodb-*" -Directory | Select-Object -First 1
          if ($srcDir) {
            New-Item -ItemType Directory -Force -Path build/mongo-portable | Out-Null
            Copy-Item -Path "$($srcDir.FullName)\*" -Destination build/mongo-portable -Recurse -Force
          }
          Remove-Item -Path build/mongo.zip,build/mongo-extract -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "=== mongo-portable contents ==="
          Get-ChildItem build/mongo-portable -Recurse -File | Select-Object Name | Select-Object -First 10

      - name: Download Microsoft VC++ Redistributable (required by MongoDB 7.0)
        shell: powershell
        run: |
          # MongoDB 7.0.x mongod.exe links against VCRUNTIME140_1.dll
          # which only ships with the Visual C++ 2015-2022 Redistributable.
          # On a fresh Windows 10 install without recent updates this
          # DLL is missing -> mongod.exe silently fails on first boot
          # and the Krexion Database service never starts.
          # We bundle the redistributable directly into the installer
          # and run it silently (idempotent - exits 1638 if a newer
          # version is already installed).
          New-Item -ItemType Directory -Force -Path build/vcredist | Out-Null
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $out = "build/vcredist/vc_redist.x64.exe"
          for ($i = 1; $i -le 3; $i++) {
            try {
              Write-Host "Attempt $i : downloading vc_redist.x64.exe from aka.ms..."
              Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -TimeoutSec 180
              break
            } catch {
              Write-Warning "Attempt $i failed: $($_.Exception.Message)"
              if ($i -eq 3) { throw }
              Start-Sleep -Seconds (5 * $i)
            }
          }
          $size = (Get-Item $out).Length
          Write-Host "=== VC++ Redistributable ready: $out ($size bytes) ==="

      - name: Download Microsoft Edge WebView2 Runtime bootstrapper (required by PyWebView)
        shell: powershell
        run: |
          # PyWebView 5.x on Windows uses the EdgeChromium backend which
          # requires Microsoft's WebView2 Runtime. Win11 ships it pre-
          # installed, but a clean Win10 install (especially LTSC /
          # older 1809-1909 builds, Server 2019, N editions) does NOT -
          # the Krexion dashboard window would silently fail to appear
          # (customer only sees krexion.com open in their browser, no
          # local window, no tray icon).
          #
          # We bundle Microsoft's official Evergreen bootstrapper
          # (~1.6 MB) and run it silently from the installer. It is
          # idempotent - exits 0 instantly if WebView2 is already on
          # the PC, otherwise downloads + installs the latest runtime.
          New-Item -ItemType Directory -Force -Path build/webview2 | Out-Null
          $url = "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          $out = "build/webview2/MicrosoftEdgeWebview2Setup.exe"
          for ($i = 1; $i -le 3; $i++) {
            try {
              Write-Host "Attempt $i : downloading WebView2 Evergreen bootstrapper..."
              Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -TimeoutSec 120
              break
            } catch {
              Write-Warning "Attempt $i failed: $($_.Exception.Message)"
              if ($i -eq 3) { throw }
              Start-Sleep -Seconds (5 * $i)
            }
          }
          $size = (Get-Item $out).Length
          Write-Host "=== WebView2 bootstrapper ready: $out ($size bytes) ==="

      - name: Bundle Playwright Chromium + WebKit (RUT Android/iOS engines)
        shell: powershell
        run: |
          # Krexion heavy features drive Playwright:
          #   • Chromium (+ headless-shell) — Android / desktop RUT
          #   • WebKit — iOS Safari-honest visits (v2.7.9+ dual-engine)
          # Backend reads PLAYWRIGHT_BROWSERS_PATH (= {app}\browser-engine
          # after Inno install). Customer must NOT run `playwright install`
          # manually — the EXE ships the full browser-engine folder.
          #
          # Output lands in build/chromium-bundle/ (legacy folder name);
          # Inno copies it to DestDir {app}\browser-engine.
          $env:PLAYWRIGHT_BROWSERS_PATH = "$PWD\build\chromium-bundle"
          New-Item -ItemType Directory -Force -Path $env:PLAYWRIGHT_BROWSERS_PATH | Out-Null
          $py = Join-Path $PWD 'build\dist\krexion-backend.dist\krexion-core.exe'
          if (-not (Test-Path $py)) { throw "krexion-core.exe missing; cannot install Playwright browsers" }
          Write-Host "Installing Playwright Chromium + WebKit with bundled $py"
          & $py -m pip install --upgrade pip
          & $py -m pip install playwright==1.49.1
          # Ship all three: full chromium, headless-shell, and webkit.
          & $py -m playwright install chromium chromium-headless-shell webkit
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Playwright install returned exit $LASTEXITCODE - continuing build (chromium-bundle may be partial)"
          }
          Write-Host "=== browser-engine bundle contents (top level) ==="
          Get-ChildItem build/chromium-bundle -Directory -ErrorAction SilentlyContinue |
            Select-Object Name, FullName | Format-Table -AutoSize | Out-String -Width 200
          $hasWebkit = @(Get-ChildItem build/chromium-bundle -Directory -Filter 'webkit-*' -ErrorAction SilentlyContinue).Count -gt 0
          if (-not $hasWebkit) {
            Write-Warning "webkit-* folder missing from bundle — iOS dual-engine will fall back to Android Chrome until install webkit succeeds"
          } else {
            Write-Host "WebKit present in bundle — iOS engine ready for EXE installs"
          }
          $totalSize = (Get-ChildItem build/chromium-bundle -Recurse -File -ErrorAction SilentlyContinue |
                        Measure-Object -Property Length -Sum).Sum
          Write-Host "Total chromium-bundle size: $([math]::Round($totalSize / 1MB, 1)) MB"

      - name: Install NSSM (via Chocolatey + GitHub mirror fallback)
        shell: powershell
        run: |
          # NSSM's official mirror (nssm.cc) is flaky - it has
          # historically returned 503 Service Temporarily Unavailable
          # and gone offline for entire days. The whole native-build
          # pipeline used to depend on one Invoke-WebRequest to that
          # host, which made the build non-deterministic.
          #
          # Reliable fallback chain (first one that succeeds wins):
          #   1. Chocolatey "nssm" package - preinstalled on every
          #      windows-latest runner, fetches via chocolatey.org
          #      (Cloudflare CDN, ~100 percent uptime).
          #   2. nssm.cc with 3-attempt retry - the original source,
          #      kept as backup.
          #   3. web.archive.org wayback snapshot - never goes away.
          New-Item -ItemType Directory -Force -Path build/nssm-portable | Out-Null
          $ok = $false

          # Source 1: Chocolatey
          try {
            Write-Host "[1/3] Installing NSSM via Chocolatey..."
            choco install nssm -y --no-progress --limit-output
            $candidates = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\NSSM" -Recurse -Filter "nssm.exe" -ErrorAction SilentlyContinue
            $real = $candidates | Where-Object { $_.FullName -match 'win64' } | Select-Object -First 1
            if (-not $real) { $real = $candidates | Select-Object -First 1 }
            if ($real) {
              Copy-Item -Path $real.FullName -Destination "build/nssm-portable/nssm.exe" -Force
              Write-Host "    OK from $($real.FullName)"
              $ok = $true
            }
          } catch {
            Write-Warning "[1/3] Chocolatey nssm install failed: $($_.Exception.Message)"
          }

          # Source 2: nssm.cc with retry
          if (-not $ok) {
            $url = "https://nssm.cc/release/nssm-2.24.zip"
            for ($i = 1; $i -le 3; $i++) {
              if ($ok) { break }
              try {
                Write-Host "[2/3] Attempt $i : downloading from nssm.cc..."
                Invoke-WebRequest -Uri $url -OutFile "build/nssm.zip" -UseBasicParsing -TimeoutSec 120
                Expand-Archive -Path "build/nssm.zip" -DestinationPath "build/nssm-extract" -Force
                Copy-Item -Path "build/nssm-extract/nssm-2.24/win64/nssm.exe" -Destination "build/nssm-portable/nssm.exe" -Force
                Remove-Item -Path "build/nssm.zip","build/nssm-extract" -Recurse -Force -ErrorAction SilentlyContinue
                $ok = $true
              } catch {
                Write-Warning "[2/3] nssm.cc attempt $i failed: $($_.Exception.Message)"
                Start-Sleep -Seconds (5 * $i)
              }
            }
          }

          # Source 3: web.archive.org
          if (-not $ok) {
            try {
              Write-Host "[3/3] Falling back to web.archive.org..."
              $wb = "https://web.archive.org/web/2024if_/https://nssm.cc/release/nssm-2.24.zip"
              Invoke-WebRequest -Uri $wb -OutFile "build/nssm.zip" -UseBasicParsing -TimeoutSec 180
              Expand-Archive -Path "build/nssm.zip" -DestinationPath "build/nssm-extract" -Force
              Copy-Item -Path "build/nssm-extract/nssm-2.24/win64/nssm.exe" -Destination "build/nssm-portable/nssm.exe" -Force
              Remove-Item -Path "build/nssm.zip","build/nssm-extract" -Recurse -Force -ErrorAction SilentlyContinue
              $ok = $true
            } catch {
              Write-Warning "[3/3] web.archive.org fallback failed: $($_.Exception.Message)"
            }
          }

          if (-not $ok) {
            Write-Host "::error::All NSSM acquisition methods failed (chocolatey + nssm.cc + web.archive.org)"
            exit 1
          }

          if (-not (Test-Path "build/nssm-portable/nssm.exe")) {
            Write-Host "::error::build/nssm-portable/nssm.exe not present after acquisition"
            exit 1
          }

          $size = (Get-Item "build/nssm-portable/nssm.exe").Length
          Write-Host "=== NSSM ready: build/nssm-portable/nssm.exe ($size bytes) ==="

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Prepare code signing credentials
        shell: powershell
        env:
          KREXION_CODESIGN_PFX_BASE64: ${{ secrets.KREXION_CODESIGN_PFX_BASE64 }}
          KREXION_CODESIGN_PFX_PASSWORD: ${{ secrets.KREXION_CODESIGN_PFX_PASSWORD }}
          KREXION_CODESIGN_THUMBPRINT: ${{ secrets.KREXION_CODESIGN_THUMBPRINT }}
          AZURE_CODESIGN_METADATA_JSON: ${{ secrets.AZURE_CODESIGN_METADATA_JSON }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = 'C:\krexion-ci-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $configured = $false
          if ($env:KREXION_CODESIGN_PFX_BASE64) {
            $pfx = Join-Path $cache 'krexion-codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:KREXION_CODESIGN_PFX_BASE64))
            Add-Content -Path $env:GITHUB_ENV -Value ('KREXION_CODESIGN_PFX_PATH=' + $pfx)
            if (-not $env:KREXION_CODESIGN_PFX_PASSWORD) {
              throw 'KREXION_CODESIGN_PFX_PASSWORD secret is required with KREXION_CODESIGN_PFX_BASE64'
            }
            $configured = $true
            Write-Host 'Code signing: PFX secret loaded'
          }
          if ($env:KREXION_CODESIGN_THUMBPRINT) {
            Add-Content -Path $env:GITHUB_ENV -Value ('KREXION_CODESIGN_THUMBPRINT=' + $env:KREXION_CODESIGN_THUMBPRINT)
            $configured = $true
            Write-Host 'Code signing: cert thumbprint configured'
          }
          if ($env:AZURE_CODESIGN_METADATA_JSON) {
            $dlib = Join-Path $cache 'Azure.CodeSigning.Dlib.dll'
            if (-not (Test-Path $dlib)) {
              Write-Host 'Downloading Azure.CodeSigning.Dlib.dll ...'
              Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Azure.CodeSigning.Dlib/1.0.68' -OutFile (Join-Path $cache 'azure-dlib.zip') -UseBasicParsing
              Expand-Archive -Path (Join-Path $cache 'azure-dlib.zip') -DestinationPath (Join-Path $cache 'azure-dlib') -Force
              $found = Get-ChildItem -Path (Join-Path $cache 'azure-dlib') -Recurse -Filter 'Azure.CodeSigning.Dlib.dll' | Select-Object -First 1
              if (-not $found) { throw 'Azure.CodeSigning.Dlib.dll not found in NuGet package' }
              Copy-Item $found.FullName $dlib -Force
            }
            Add-Content -Path $env:GITHUB_ENV -Value ('AZURE_CODESIGN_DLIB=' + $dlib)
            $configured = $true
            Write-Host 'Code signing: Azure Artifact Signing metadata configured'
          }
          if (-not $configured) {
            Write-Host '::warning::No code-signing secrets configured — Smart App Control may block unsigned installs on Windows 11. See deployment/CODESIGN-SETUP.md'
            Add-Content -Path $env:GITHUB_ENV -Value 'KREXION_SKIP_CODESIGN=1'
          }

      - name: Install Windows SDK signtool (if missing)
        shell: powershell
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($signtool) {
            Write-Host "signtool already present: $($signtool.FullName)"
            exit 0
          }
          Write-Host 'Installing Windows SDK Signing Tools...'
          choco install windows-sdk-10-version -y --no-progress --version=10.0.22621.755

      - name: Sign bundled executables (Smart App Control)
        if: env.KREXION_SKIP_CODESIGN != '1'
        shell: powershell
        env:
          KREXION_CODESIGN_PFX_PATH: ${{ env.KREXION_CODESIGN_PFX_PATH }}
          KREXION_CODESIGN_PFX_PASSWORD: ${{ secrets.KREXION_CODESIGN_PFX_PASSWORD }}
          KREXION_CODESIGN_THUMBPRINT: ${{ secrets.KREXION_CODESIGN_THUMBPRINT }}
          AZURE_CODESIGN_DLIB: ${{ env.AZURE_CODESIGN_DLIB }}
          AZURE_CODESIGN_METADATA_JSON: ${{ secrets.AZURE_CODESIGN_METADATA_JSON }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/sign-krexion-release.ps1

      - name: Compile installer
        shell: powershell
        run: |
          if (Test-Path installer/Output) { Remove-Item -Recurse -Force installer/Output }
          New-Item -ItemType Directory -Force -Path installer/Output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
              /Qp installer/krexion-setup.iss `
              /DAppVersion=${{ needs.build-backend.outputs.version }} `
              /DAppVersionNumeric=${{ needs.build-backend.outputs.numeric_version }}
          Write-Host "=== installer/Output contents ==="
          Get-ChildItem installer/Output -ErrorAction SilentlyContinue

      - name: Sign Krexion-Setup.exe
        if: env.KREXION_SKIP_CODESIGN != '1'
        shell: powershell
        env:
          KREXION_CODESIGN_PFX_PATH: ${{ env.KREXION_CODESIGN_PFX_PATH }}
          KREXION_CODESIGN_PFX_PASSWORD: ${{ secrets.KREXION_CODESIGN_PFX_PASSWORD }}
          KREXION_CODESIGN_THUMBPRINT: ${{ secrets.KREXION_CODESIGN_THUMBPRINT }}
          AZURE_CODESIGN_DLIB: ${{ env.AZURE_CODESIGN_DLIB }}
          AZURE_CODESIGN_METADATA_JSON: ${{ secrets.AZURE_CODESIGN_METADATA_JSON }}
          VER: ${{ needs.build-backend.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "installer/Output/Krexion-Setup-$($env:VER).exe"
          if (-not (Test-Path $setup)) {
            $setup = (Get-ChildItem installer/Output/Krexion-Setup-*.exe | Select-Object -First 1).FullName
          }
          if (-not $setup -or -not (Test-Path $setup)) { throw 'Krexion-Setup exe not found after ISCC' }
          & ./scripts/sign-krexion-release.ps1 $setup
          $sig = Get-AuthenticodeSignature $setup
          Write-Host "Installer signature status: $($sig.Status) · Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Installer signature not Valid: $($sig.Status)" }

      - name: Create GitHub Release + upload installer
        # No marketplace actions (429 on self-hosted). Creates the
        # vX.Y.Z release via API if missing, then uploads the .exe
        # with 3 attempts for residential-ISP ECONNRESET.
        if: startsWith(needs.build-backend.outputs.version, 'v')
        timeout-minutes: 40
        shell: powershell
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build-backend.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo  = $env:GITHUB_REPOSITORY
          $tag   = $env:RELEASE_TAG
          $token = $env:RELEASE_TOKEN
          if (-not $token) { $token = $env:GITHUB_TOKEN }
          $expectedName = "Krexion-Setup-$tag.exe"
          $expectedPath = Join-Path "installer/Output" $expectedName
          if (-not (Test-Path $expectedPath)) {
            throw "Expected $expectedName in installer/Output but not found. ISCC compile must have failed."
          }
          $expected = @($expectedPath)
          $headers = @{
            'Authorization' = "token $token"
            'Accept'        = 'application/vnd.github+json'
            'User-Agent'    = 'krexion-release-uploader'
          }

          $lastErr = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Write-Host "=== Release attempt $attempt of 3 for tag=$tag ==="
              $rel = $null
              try {
                $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers -Method Get
              } catch {
                Write-Host "  tag endpoint: $($_.Exception.Message)"
              }
              if (-not $rel -or -not $rel.id) {
                $all = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases?per_page=30" -Headers $headers -Method Get
                $rel = $all | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
              }
              if (-not $rel -or -not $rel.id) {
                Write-Host "  creating release $tag ..."
                $create = @{
                  tag_name   = $tag
                  name       = "Krexion $tag"
                  draft      = $false
                  prerelease = $false
                } | ConvertTo-Json -Compress
                $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases" -Headers $headers -Method Post -Body $create -ContentType 'application/json'
              }
              Write-Host "  found id=$($rel.id)  draft=$($rel.draft)  assets=$($rel.assets.Count)"

              foreach ($file in $expected) {
                $name      = [System.IO.Path]::GetFileName($file)
                $localSize = (Get-Item $file).Length
                $existing  = $rel.assets | Where-Object { $_.name -eq $name }
                if ($existing -and $existing.size -eq $localSize) {
                  Write-Host "  [OK]     $name  ($localSize bytes already uploaded)"
                  continue
                }
                if ($existing) {
                  Write-Host "  [DELETE] $name  (attached size $($existing.size) != local $localSize)"
                  Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/assets/$($existing.id)" -Headers $headers -Method Delete | Out-Null
                }
                Write-Host "  [UPLOAD] $name  ($localSize bytes) ..."
                $uploadUrl = ($rel.upload_url -replace '\{.*\}$', '') + "?name=$name"
                Add-Type -AssemblyName System.Net.Http
                $client = New-Object System.Net.Http.HttpClient
                $client.Timeout = [TimeSpan]::FromMinutes(25)
                [void]$client.DefaultRequestHeaders.TryAddWithoutValidation('Authorization', "token $token")
                [void]$client.DefaultRequestHeaders.TryAddWithoutValidation('Accept', 'application/vnd.github+json')
                [void]$client.DefaultRequestHeaders.TryAddWithoutValidation('User-Agent', 'krexion-release-uploader')
                $stream = [System.IO.File]::OpenRead($file)
                try {
                  $content = New-Object System.Net.Http.StreamContent($stream)
                  $content.Headers.ContentType = New-Object System.Net.Http.Headers.MediaTypeHeaderValue('application/octet-stream')
                  $content.Headers.ContentLength = $localSize
                  $resp = $client.PostAsync($uploadUrl, $content).GetAwaiter().GetResult()
                  if (-not $resp.IsSuccessStatusCode) {
                    $body = $resp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                    throw "Upload of $name failed: HTTP $([int]$resp.StatusCode) $($resp.ReasonPhrase) -- $body"
                  }
                  Write-Host "  [DONE]   $name"
                } finally {
                  $stream.Dispose()
                  $client.Dispose()
                }
                $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)" -Headers $headers -Method Get
              }

              if ($rel.draft) {
                Write-Host "Publishing (undraft) release id=$($rel.id) ..."
                $body = @{ draft = $false } | ConvertTo-Json -Compress
                Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)" -Headers $headers -Method Patch -Body $body -ContentType 'application/json' | Out-Null
              }
              Write-Host "Release $tag verified and published. Assets present:"
              $final = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)" -Headers $headers -Method Get
              foreach ($a in $final.assets) { Write-Host "  - $($a.name)  size=$($a.size)  state=$($a.state)" }
              $lastErr = $null
              break
            } catch {
              $lastErr = $_
              Write-Warning "Release attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -lt 3) { Start-Sleep -Seconds 60 }
            }
          }
          if ($lastErr) { throw $lastErr }

      - name: Upload native installer via GitHub API (mirror handoff)
        if: startsWith(needs.build-backend.outputs.version, 'v')
        continue-on-error: true
        timeout-minutes: 40
        shell: powershell
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build-backend.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $file = Join-Path "installer/Output" "Krexion-Setup-$tag.exe"
          if (-not (Test-Path $file)) { throw "Missing $file for artifact upload" }
          $token = if ($env:RELEASE_TOKEN) { $env:RELEASE_TOKEN } else { $env:GITHUB_TOKEN }
          $repo = $env:GITHUB_REPOSITORY
          $runId = $env:GITHUB_RUN_ID
          $zip = "native-installer-$tag.zip"
          Compress-Archive -Path $file -DestinationPath $zip -Force
          $size = (Get-Item $zip).Length
          Write-Host "Uploading workflow artifact krexion-native-installer ($size bytes) for run $runId ..."
          Add-Type -AssemblyName System.Net.Http
          $client = New-Object System.Net.Http.HttpClient
          $client.Timeout = [TimeSpan]::FromMinutes(30)
          [void]$client.DefaultRequestHeaders.TryAddWithoutValidation('Authorization', "token $token")
          [void]$client.DefaultRequestHeaders.TryAddWithoutValidation('Accept', 'application/vnd.github+json')
          [void]$client.DefaultRequestHeaders.TryAddWithoutValidation('User-Agent', 'krexion-native-artifact')
          $boundary = [System.Guid]::NewGuid().ToString()
          $enc = [System.Text.Encoding]::UTF8
          $fileBytes = [System.IO.File]::ReadAllBytes($zip)
          $bodyStream = New-Object System.IO.MemoryStream
          $writer = New-Object System.IO.StreamWriter($bodyStream, $enc)
          $writer.Write("--$boundary`r`n")
          $writer.Write("Content-Disposition: form-data; name=`"name`"`r`n`r`n")
          $writer.Write("krexion-native-installer`r`n")
          $writer.Write("--$boundary`r`n")
          $writer.Write("Content-Disposition: form-data; name=`"retention_days`"`r`n`r`n")
          $writer.Write("3`r`n")
          $writer.Write("--$boundary`r`n")
          $writer.Write("Content-Disposition: form-data; name=`"file`"; filename=`"$zip`"`r`n")
          $writer.Write("Content-Type: application/zip`r`n`r`n")
          $writer.Flush()
          $headerBytes = $enc.GetBytes($writer.ToString())
          $bodyStream.Write($headerBytes, 0, $headerBytes.Length)
          $bodyStream.Write($fileBytes, 0, $fileBytes.Length)
          $footer = $enc.GetBytes("`r`n--$boundary--`r`n")
          $bodyStream.Write($footer, 0, $footer.Length)
          $content = New-Object System.Net.Http.ByteArrayContent($bodyStream.ToArray())
          $content.Headers.ContentType = [System.Net.Http.Headers.MediaTypeHeaderValue]::Parse("multipart/form-data; boundary=$boundary")
          $uri = "https://uploads.github.com/repos/$repo/actions/artifacts?name=krexion-native-installer&retention_days=3"
          $resp = $client.PostAsync($uri, $content).GetAwaiter().GetResult()
          if (-not $resp.IsSuccessStatusCode) {
            $err = $resp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
            throw "Artifact upload failed: HTTP $([int]$resp.StatusCode) $err"
          }
          Write-Host "Artifact krexion-native-installer uploaded for mirror job"

  # ─────────────────────────────────────────────────────────────────
  # 2026-06 — SELF-HOSTED MIRROR for the Native (Inno-Setup) installer.
  #
  # Customer ask: "window wale button pr native latest release ka button
  # laga do" — the public DownloadPage on krexion.com needs a SINGLE
  # stable URL for the Windows installer (e.g. .../downloads/windows/
  # Krexion-Setup-latest.exe) so we can rebuild every release without
  # touching the marketing page. GitHub Releases versions the filename
  # (Krexion-Setup-v2.1.57.exe) so a stable redirect isn't possible
  # there alone — mirroring to the VPS gives us the version-less alias.
  #
  # Same pattern as build-electron-desktop.yml's mirror-to-vps job:
  # build runs on Windows, this job runs on Ubuntu (appleboy/scp-action
  # is a Linux-only Docker action), downloads from the just-published
  # GitHub Release, SCPs to /opt/krexion/downloads/windows/ on the VPS,
  # then SSHs in to copy → Krexion-Setup-latest.exe.
  #
  # Required secrets (already configured for deploy.yml + electron mirror):
  #   VPS_HOST, VPS_USER, VPS_PORT (optional), VPS_SSH_KEY
  # ─────────────────────────────────────────────────────────────────
  mirror-windows-to-vps:
    name: Mirror Windows installer to krexion.com VPS
    needs: [build-backend, build-installer]
    # 2026-01-09 — moved from ubuntu-latest to krexion-vps runner.
    # Since the runner IS the VPS, SCP+SSH is replaced by local `cp`.
    # Free forever + faster (no network round-trip).
    runs-on: [self-hosted, linux, krexion-vps]
    # Only mirror when an actual release was created (mirrors the Create
    # GitHub Release gate). Skipping otherwise means a dispatch without
    # a release_tag won't try to mirror a non-existent build.
    if: ${{ needs.build-installer.result == 'success' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout VERSION (rerun-safe version resolve)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          SHA="${{ github.sha }}"
          if [ ! -d .git ]; then
            git init
            git remote add origin "$REPO"
          else
            git remote set-url origin "$REPO"
          fi
          git fetch --depth 1 origin "$SHA"
          git checkout --force --detach "$SHA"
          git reset --hard "$SHA"

      - name: Resolve release version (needs output or backend/VERSION)
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          NEEDS_VER='${{ needs.build-backend.outputs.version }}'
          if [ -n "$NEEDS_VER" ]; then
            VER="$NEEDS_VER"
          elif [ -f backend/VERSION ] && [ -s backend/VERSION ]; then
            FILE_VER=$(tr -d '[:space:]' < backend/VERSION)
            case "$FILE_VER" in
              v*) VER="$FILE_VER" ;;
              *)  VER="v$FILE_VER" ;;
            esac
          else
            echo "::error::Cannot resolve release version for mirror"
            exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved mirror version: $VER"

      - name: VPS disk self-heal (runner diag + docker)
        run: |
          set -e
          echo ">> Disk BEFORE mirror cleanup"
          df -h / /opt/krexion/downloads /opt/krexion-runner 2>/dev/null | head -8 || df -h /
          if [ -d /opt/krexion-runner/_diag ]; then
            echo ">> Trimming krexion-runner _diag logs (No space left on device fix)..."
            find /opt/krexion-runner/_diag -type f -name '*.log' -mtime +1 -delete 2>/dev/null || true
            find /opt/krexion-runner/_diag -type f -name '*.log' -size +20M -delete 2>/dev/null || true
            du -sh /opt/krexion-runner/_diag 2>/dev/null || true
          fi
          rm -rf /opt/krexion-runner/_work/_temp/* 2>/dev/null || true
          docker image prune -f 2>&1 | tail -2 || true
          docker builder prune -f --keep-storage 5GB 2>&1 | tail -2 || true
          journalctl --vacuum-size=200M 2>/dev/null || true
          echo ">> Disk AFTER mirror cleanup"
          df -h / /opt/krexion/downloads 2>/dev/null | head -6 || df -h /
          AVAIL_KB=$(df -Pk / 2>/dev/null | awk 'NR==2{print $4}')
          if [ -n "$AVAIL_KB" ] && [ "$AVAIL_KB" -lt 500000 ]; then
            echo "::error::Root disk still under 500MB free after cleanup — mirror cannot proceed safely"
            exit 1
          fi

      - name: Download installer (workflow artifact, else GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
          TARGET: Krexion-Setup-${{ steps.ver.outputs.ver }}.exe
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          rm -rf dist
          mkdir -p dist
          REPO="${{ github.repository }}"
          echo "Mirror target: $TARGET (run $GITHUB_RUN_ID)"
          GOT=0
          for i in 1 2 3 4 5 6; do
            HTTP=$(curl -s -o /tmp/arts.json -w "%{http_code}" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=50")
            if [ "$HTTP" = "200" ]; then
              ART_ID=$(python3 - <<'PY'
          import json
          with open("/tmp/arts.json") as f:
              arts = json.load(f).get("artifacts", [])
          for a in arts:
              if a.get("name") == "krexion-native-installer" and not a.get("expired"):
                  print(a["id"])
                  break
          PY
              )
              if [ -n "$ART_ID" ]; then
                echo "Downloading workflow artifact id=$ART_ID (attempt $i)..."
                if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 3600 \
                  -H "Authorization: token $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -o /tmp/native-installer.zip \
                  "https://api.github.com/repos/$REPO/actions/artifacts/$ART_ID/zip"; then
                  python3 - <<'PY'
          import glob, os, zipfile
          os.makedirs("dist", exist_ok=True)
          with zipfile.ZipFile("/tmp/native-installer.zip") as z:
              z.extractall("dist")
          exes = glob.glob("dist/**/*.exe", recursive=True) + glob.glob("dist/*.exe")
          if not exes:
              raise SystemExit("No exe in native-installer artifact zip")
          print("Extracted:", exes[0])
          PY
                  GOT=1
                  break
                fi
              fi
            fi
            echo "  artifact attempt $i: not ready, sleeping 15s..."
            sleep 15
          done
          if [ "$GOT" != "1" ]; then
            echo "Workflow artifact unavailable — falling back to GitHub Release $VER"
            for i in $(seq 1 20); do
              HTTP=$(curl -s -o /tmp/rel.json -w "%{http_code}" \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/releases/tags/$VER")
              if [ "$HTTP" != "200" ]; then
                HTTP=$(curl -s -o /tmp/rel.json -w "%{http_code}" \
                  -H "Authorization: token $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO/releases?per_page=30")
                if [ "$HTTP" = "200" ]; then
                  python3 - <<PY || true
          import json, os
          ver = os.environ["VER"]
          with open("/tmp/rel.json") as f:
              rels = json.load(f)
          match = next((r for r in rels if r.get("tag_name") == ver), None)
          if match:
              json.dump(match, open("/tmp/rel.json", "w"))
              print("found via list")
          else:
              raise SystemExit(1)
          PY
                  [ -s /tmp/rel.json ] && HTTP=200 || HTTP=404
                fi
              fi
              if [ "$HTTP" = "200" ]; then
                echo "  release visible on attempt $i"
                break
              fi
              echo "  release attempt $i: HTTP $HTTP, sleeping 15s..."
              sleep 15
            done
            if [ "$HTTP" != "200" ]; then
              echo "::error::Release tag $VER not visible after retries (HTTP $HTTP)"
              exit 1
            fi
            python3 - <<PY > /tmp/assets.tsv
          import json, os, sys
          target = os.environ["TARGET"]
          with open("/tmp/rel.json") as f:
              d = json.load(f)
          matches = [a for a in d.get("assets", []) if a.get("name") == target]
          if not matches:
              names = [a.get("name") for a in d.get("assets", [])]
              print(f"::error::Asset {target} missing on release {os.environ.get('VER')}. Have: {names}", file=sys.stderr)
              sys.exit(1)
          a = matches[0]
          print(f"{a['url']}\t{a['name']}\t{a.get('size', 0)}")
          PY
            echo "Asset to download:"
            cat /tmp/assets.tsv
            while IFS=$'\t' read -r URL NAME EXPECTED; do
              [ -z "$URL" ] && continue
              echo "Downloading $NAME (expected ${EXPECTED} bytes) ..."
              for attempt in 1 2 3 4 5; do
                if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 3600 \
                  -H "Authorization: token $GH_TOKEN" \
                  -H "Accept: application/octet-stream" \
                  -o "dist/$NAME" "$URL"; then
                  GOT=$(stat -c%s "dist/$NAME" 2>/dev/null || wc -c < "dist/$NAME")
                  if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "0" ] && [ "$GOT" != "$EXPECTED" ]; then
                    echo "  attempt $attempt: size mismatch got=$GOT expected=$EXPECTED"
                    rm -f "dist/$NAME"
                    sleep 15
                    continue
                  fi
                  echo "  downloaded $NAME ($GOT bytes)"
                  break
                fi
                echo "  attempt $attempt failed, retrying..."
                rm -f "dist/$NAME"
                sleep 15
              done
              test -s "dist/$NAME"
            done < /tmp/assets.tsv
          fi
          ls -lah dist/

      - name: Copy installer to VPS downloads dir (local — runner IS the VPS)
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -e
          # Fail early if disk is critically low — prune old installers first.
          AVAIL_KB=$(df -Pk /opt/krexion/downloads 2>/dev/null | awk 'NR==2{print $4}')
          if [ -n "$AVAIL_KB" ] && [ "$AVAIL_KB" -lt 2500000 ]; then
            echo "Low disk on /opt/krexion/downloads — pruning old Windows installers..."
            mkdir -p /opt/krexion/downloads/windows
            cd /opt/krexion/downloads/windows
            ls -1t Krexion-Setup-v*.exe 2>/dev/null | tail -n +2 | xargs -r rm -f --
            docker system prune -f 2>/dev/null || true
            AVAIL_KB=$(df -Pk /opt/krexion/downloads 2>/dev/null | awk 'NR==2{print $4}')
            if [ -n "$AVAIL_KB" ] && [ "$AVAIL_KB" -lt 700000 ]; then
              echo "::error::Not enough free disk on VPS after cleanup (<700MB)."
              df -h / /opt/krexion/downloads || true
              exit 1
            fi
          fi
          mkdir -p /opt/krexion/downloads/windows
          INSTALLER="dist/Krexion-Setup-${VER}.exe"
          if [ ! -f "$INSTALLER" ]; then
            echo "::error::Expected installer missing: $INSTALLER"
            ls -la dist/ || true
            exit 1
          fi
          cp -f "$INSTALLER" /opt/krexion/downloads/windows/
          cd /opt/krexion/downloads/windows
          # Hard-copy (not symlink) so the nginx docker volume mount
          # serves the file identically to versioned ones — matches
          # the desktop mirror's behaviour.
          if [ -f "Krexion-Setup-${VER}.exe" ]; then
            cp -f "Krexion-Setup-${VER}.exe" "Krexion-Setup-latest.exe"
          else
            echo "::warning::Expected Krexion-Setup-${VER}.exe but not found — picking newest .exe instead"
            NEWEST=$(ls -t Krexion-Setup-*.exe 2>/dev/null | grep -v latest | head -1)
            [ -n "$NEWEST" ] && cp -f "$NEWEST" "Krexion-Setup-latest.exe" || true
          fi
          # Keep download button URL forever-stable AND disk healthy:
          # always refresh *-latest.exe above, then prune older versioned
          # EXEs (keep current + 1 previous). Site buttons already point at
          # Krexion-Setup-latest.exe so customers always get newest.
          KEEP_N=2
          mapfile -t KEEP_VER < <(ls -1t Krexion-Setup-v*.exe 2>/dev/null | head -n "$KEEP_N")
          echo "Keeping versioned Windows installers: ${KEEP_VER[*]:-none}"
          for f in Krexion-Setup-v*.exe; do
            [ -f "$f" ] || continue
            keep=0
            for k in "${KEEP_VER[@]}"; do [ "$f" = "$k" ] && keep=1 && break; done
            [ "$keep" = "0" ] && rm -f -- "$f" && echo "pruned $f"
          done
          test -f Krexion-Setup-latest.exe
          ls -la
          chmod -R a+r .
          echo "Self-hosted CDN updated (always-latest):"
          echo "  https://krexion.com/downloads/windows/Krexion-Setup-latest.exe"
