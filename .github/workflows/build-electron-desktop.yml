name: Build Krexion Desktop (Electron)

# ────────────────────────────────────────────────────────────────────────────
# Parallel Electron build pipeline. Completely independent of the existing
# Inno-Setup workflow (`build-windows-release.yml`). Produces:
#
#     Krexion-Desktop-Setup-<version>.exe
#
# which does NOT collide with the classic `Krexion-Setup-<version>.exe`.
# ────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. desktop-v2.1.8). Empty = artifact only, no GH Release.'
        required: false
        default: ''
  # 2026-02 v2.1.32: mirror the Windows-native auto-trigger. Whenever
  # backend/VERSION bumps, the Electron desktop build also fires
  # automatically — so the customer's auto-update channel
  # (latest.yml on https://krexion.com/downloads/desktop/) gets the
  # new version on the same push, not 24h later via a manual dispatch.
  push:
    branches: [main]
    paths:
      - 'backend/VERSION'
      - '.github/workflows/build-electron-desktop.yml'

permissions:
  contents: write

# v2.6.52 consolidated release — cancel-in-progress ensures only the
# latest VERSION bump builds (no stale 2.6.50/51 desktop installers).
concurrency:
  group: krexion-electron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Electron installer (Windows x64)
    # v2.6.56 — GitHub-hosted Windows so Electron runs IN PARALLEL with
    # the native Inno installer on krexion-windows. One self-hosted PC
    # can only run one Windows job at a time; queuing Electron behind
    # a 2h native build wasted ~45 min every release.
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Yarn (Corepack)
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute version
        id: version
        shell: bash
        run: |
          v=$(tr -d '[:space:]' < backend/VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building Krexion Desktop v$v"

      - name: Sync package.json version
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $pkgPath = "electron-desktop/package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = $v
          ($pkg | ConvertTo-Json -Depth 50) | Set-Content $pkgPath -Encoding UTF8

      - name: Cache resource downloads
        uses: actions/cache@v4
        with:
          path: electron-desktop/.cache
          key: krexion-desktop-cache-py3.11.9-mongo7.0.14-v1

      - name: Install Electron deps
        working-directory: electron-desktop
        run: yarn install --network-timeout 600000

      - name: Prepare resources (Python + MongoDB + frontend + backend)
        working-directory: electron-desktop
        run: yarn prepare-resources

      # ────────────────────────────────────────────────────────────
      # 2026-02 — Pre-cache the NSIS binaries from
      # github.com/electron-userland/electron-builder-binaries before
      # the actual electron-builder run. GitHub's release CDN keeps
      # returning HTTP 504 on these (twice in a row killed v2.1.27
      # builds). By downloading them ourselves with curl --retry into
      # the same %LOCALAPPDATA%\electron-builder\Cache\... directory
      # that electron-builder reads, we avoid the in-builder fetch
      # entirely — and even if curl fails, we retry the actual
      # electron-builder step up to 3 times below.
      # ────────────────────────────────────────────────────────────
      - name: Pre-cache NSIS binaries (work around GitHub 504s)
        shell: pwsh
        env:
          # 2026-07 v2.6.11 CI FIX — pin electron-builder cache to a
          # runner-writable path so both the pre-cache step AND the
          # electron-builder step read/write the SAME directory. On
          # self-hosted Windows runners running under SYSTEM,
          # %LOCALAPPDATA% resolves to C:\Windows\System32\config\...
          # while electron-builder falls back to %TEMP%\electron-builder-cache
          # → the two paths diverge → NSIS pre-cache extracted to
          # LOCALAPPDATA never seen by electron-builder → build fails
          # with "ENOENT ... elevate.exe". Setting the env var here
          # forces a single source of truth.
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
        run: |
          $cacheRoot = $env:ELECTRON_BUILDER_CACHE
          $nsisDir   = "$cacheRoot\nsis\nsis-3.0.4.1"
          $resDir    = "$cacheRoot\nsis\nsis-resources-3.4.1"
          New-Item -ItemType Directory -Force -Path $nsisDir | Out-Null
          New-Item -ItemType Directory -Force -Path $resDir  | Out-Null
          Write-Host "Pre-caching into $cacheRoot"

          function Fetch($url, $out) {
            for ($i = 1; $i -le 5; $i++) {
              try {
                Write-Host "Attempt $i -> $url"
                Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -TimeoutSec 120 -ErrorAction Stop
                Write-Host "  ok downloaded ($([math]::Round((Get-Item $out).Length/1MB,1)) MB)"
                return $true
              } catch {
                Write-Host "  x attempt $i failed: $($_.Exception.Message)"
                Start-Sleep -Seconds (5 * $i)
              }
            }
            return $false
          }

          $tmp1 = "$env:RUNNER_TEMP\nsis-3.0.4.1.7z"
          $tmp2 = "$env:RUNNER_TEMP\nsis-resources-3.4.1.7z"
          $ok1 = Fetch "https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z" $tmp1
          $ok2 = Fetch "https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-resources-3.4.1/nsis-resources-3.4.1.7z" $tmp2

          if ($ok1) {
            7z x $tmp1 "-o$nsisDir" -y | Out-Null
            Write-Host "Extracted NSIS -> $nsisDir"
            # v2.6.11 CI FIX — verify the critical binary is present.
            # If elevate.exe / makensis.exe are missing the extract
            # silently failed and the retry step below will loop
            # forever. Log clearly and hard-fail so we notice.
            $mustHave = @("elevate.exe", "makensis.exe")
            foreach ($f in $mustHave) {
              $p = Join-Path $nsisDir $f
              if (Test-Path $p) {
                Write-Host "  ok $f present ($([math]::Round((Get-Item $p).Length/1KB,1)) KB)"
              } else {
                Write-Host "::error::$f MISSING from $nsisDir — extract failed"
              }
            }
          }
          if ($ok2) {
            7z x $tmp2 "-o$resDir" -y | Out-Null
            Write-Host "Extracted NSIS-resources -> $resDir"
          }
          # v2.6.11 CI FIX — ALSO mirror into the legacy fallback path
          # electron-builder uses on some machine configurations
          # (%LOCALAPPDATA%\electron-builder\Cache). Belt-and-braces:
          # whichever path electron-builder decides to use at runtime,
          # the NSIS bits are already there.
          try {
            $legacyRoot = "$env:LOCALAPPDATA\electron-builder\Cache"
            if ($legacyRoot -and $legacyRoot -ne $cacheRoot) {
              $legacyNsis = "$legacyRoot\nsis\nsis-3.0.4.1"
              $legacyRes  = "$legacyRoot\nsis\nsis-resources-3.4.1"
              New-Item -ItemType Directory -Force -Path $legacyNsis | Out-Null
              New-Item -ItemType Directory -Force -Path $legacyRes  | Out-Null
              Copy-Item -Path "$nsisDir\*" -Destination $legacyNsis -Recurse -Force -ErrorAction SilentlyContinue
              Copy-Item -Path "$resDir\*"  -Destination $legacyRes  -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Mirrored NSIS -> $legacyRoot"
            }
          } catch {
            Write-Host "  (legacy mirror skipped: $($_.Exception.Message))"
          }
          # Don't fail the job if pre-cache fails — the retry step below
          # is still our safety net.

      - name: Build NSIS installer (with retry — GitHub CDN sometimes 504s)
        uses: nick-fields/retry@v3
        env:
          # 2026-07 v2.6.11 CI FIX — force electron-builder to read
          # from the SAME cache path the pre-cache step wrote to.
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_wait_seconds: 90
          shell: bash
          command: |
            cd electron-desktop
            npx electron-builder --win --x64 --publish never

      - name: List dist artifacts (debug)
        working-directory: electron-desktop
        shell: bash
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          echo "=== latest.yml (auto-update manifest) ==="
          if [ -f dist/latest.yml ]; then
            cat dist/latest.yml
          else
            echo "::error::dist/latest.yml NOT produced — auto-update will not work"
            exit 1
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        # 2026-01: GitHub free-tier accounts hit the 500 MB artifact
        # quota fast. We mark this upload as continue-on-error so the
        # subsequent "Create GitHub Release" step still runs — GitHub
        # Releases do NOT count against the artifact quota and that's
        # what electron-updater actually polls for customer auto-update.
        continue-on-error: true
        with:
          name: Krexion-Desktop-Setup-${{ steps.version.outputs.version }}
          # Upload BOTH the installer .exe AND the latest.yml manifest.
          # latest.yml is what electron-updater (inside the installed
          # customer app) reads to detect new versions.
          path: |
            electron-desktop/dist/Krexion-Desktop-Setup-*.exe
            electron-desktop/dist/Krexion-Desktop-Setup-*.exe.blockmap
            electron-desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 3

      - name: Create GitHub Release (when release_tag provided OR on VERSION push)
        # 2026-02 v2.1.32: also publish a release on push-triggered builds
        # (auto-tag = v<VERSION>). Without this the latest.yml auto-update
        # channel never gets the new build because Electron Desktop only
        # picks up updates from a real GH Release attaching latest.yml.
        #
        # 2026-01-10 v2.5.2: marked continue-on-error because on self-hosted
        # Windows runners the ~600 MB .exe upload hits ECONNRESET after
        # ~2 min on flaky residential ISPs, leaving the release as a
        # draft with partial assets. The follow-up "Verify + Repair GH
        # Release" step below is idempotent and completes/publishes the
        # release with proper retry semantics.
        if: ${{ inputs.release_tag != '' || github.event_name == 'push' }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || format('desktop-v{0}', steps.version.outputs.version) }}
          name: Krexion Desktop ${{ steps.version.outputs.version }}
          body: |
            Krexion Desktop -- fully-local edition (auto-update enabled).

            * Local MongoDB on 127.0.0.1:27117
            * Local FastAPI backend on 127.0.0.1:8088
            * React dashboard packaged inside Electron
            * Heavy workload data never leaves the PC.
            * **Auto-update**: installed clients running this version or
              newer will silently detect future releases and prompt to
              install on next launch.

            This is the parallel Electron build. The classic Inno-Setup
            installer (`Krexion-Setup-<version>.exe`) is unaffected.
          # IMPORTANT: latest.yml MUST be uploaded alongside the .exe for
          # electron-updater to detect this release. The .blockmap file
          # enables delta updates (smaller downloads for incremental
          # updates), which electron-updater also looks for automatically.
          files: |
            electron-desktop/dist/Krexion-Desktop-Setup-*.exe
            electron-desktop/dist/Krexion-Desktop-Setup-*.exe.blockmap
            electron-desktop/dist/latest.yml
          draft: false
          prerelease: false

      - name: Verify + Repair GH Release upload (network resilience)
        # 2026-01-10 -- softprops/action-gh-release@v2 has no built-in
        # retry for individual asset uploads. When a big installer .exe
        # (~600 MB) is uploaded from a self-hosted Windows runner over
        # a residential ISP link, the upload frequently ECONNRESETs
        # after ~2 min mid-transfer. When that happens the release is
        # left as a DRAFT with a partial asset set (usually only
        # latest.yml + blockmap uploaded, the big .exe missing), and
        # customer Electron apps looking at latest.yml either 404 on
        # the .exe download or don't see the new version at all.
        #
        # This step:
        #   1. Locates the release by tag (works even if it's still a
        #      draft that the earlier step created before ECONNRESET).
        #   2. For each expected file, compares disk size vs attached
        #      asset size. If missing or mismatched, deletes the stale
        #      asset and re-uploads with a 20-minute timeout.
        #   3. Once all expected files are attached with correct sizes,
        #      patches the release to draft=false (publishes it).
        # Wrapped in nick-fields/retry@v3 (3 attempts, 60s wait) so
        # transient network drops on the RE-upload are also survived.
        if: ${{ inputs.release_tag != '' || github.event_name == 'push' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_wait_seconds: 60
          shell: powershell
          command: |
            $ErrorActionPreference = 'Stop'
            $repo    = '${{ github.repository }}'
            $tag     = if ('${{ inputs.release_tag }}' -ne '') { '${{ inputs.release_tag }}' } else { 'desktop-v${{ steps.version.outputs.version }}' }
            $token   = '${{ secrets.RELEASE_TOKEN }}'
            if (-not $token) { $token = '${{ secrets.GITHUB_TOKEN }}' }
            $expected = @(
              "electron-desktop/dist/Krexion-Desktop-Setup-${{ steps.version.outputs.version }}.exe",
              "electron-desktop/dist/Krexion-Desktop-Setup-${{ steps.version.outputs.version }}.exe.blockmap",
              "electron-desktop/dist/latest.yml"
            )
            $headers = @{
              'Authorization' = "token $token"
              'Accept'        = 'application/vnd.github+json'
              'User-Agent'    = 'krexion-release-uploader'
            }
            Write-Host "Locating release for tag=$tag ..."
            $rel = $null
            try {
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers -Method Get
            } catch {
              Write-Host "  tag endpoint returned $($_.Exception.Message) -- scanning all releases (incl. drafts)"
            }
            if (-not $rel -or -not $rel.id) {
              $all = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases?per_page=30" -Headers $headers -Method Get
              $rel = $all | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
            }
            if (-not $rel -or -not $rel.id) {
              throw "Release with tag '$tag' does not exist. The preceding softprops step should have created a draft even on partial upload failure."
            }
            Write-Host "  found id=$($rel.id)  draft=$($rel.draft)  assets=$($rel.assets.Count)"

            foreach ($file in $expected) {
              if (-not (Test-Path $file)) { throw "Expected local file missing on runner: $file" }
              $name      = [System.IO.Path]::GetFileName($file)
              $localSize = (Get-Item $file).Length
              $existing  = $rel.assets | Where-Object { $_.name -eq $name }
              if ($existing -and $existing.size -eq $localSize) {
                Write-Host "  [OK]     $name  ($localSize bytes already uploaded)"
                continue
              }
              if ($existing) {
                Write-Host "  [DELETE] $name  (attached size $($existing.size) != local $localSize)"
                Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/assets/$($existing.id)" -Headers $headers -Method Delete | Out-Null
              }
              Write-Host "  [UPLOAD] $name  ($localSize bytes) ..."
              $uploadUrl = ($rel.upload_url -replace '\{.*\}$', '') + "?name=$name"
              $uploadHeaders = @{
                'Authorization' = "token $token"
                'Accept'        = 'application/vnd.github+json'
                'User-Agent'    = 'krexion-release-uploader'
                'Content-Type'  = 'application/octet-stream'
              }
              # Use HttpClient for large files to avoid Invoke-WebRequest
              # loading the whole payload into memory (600 MB .exe would
              # OOM). Also lets us set a generous timeout.
              Add-Type -AssemblyName System.Net.Http
              $client = New-Object System.Net.Http.HttpClient
              $client.Timeout = [TimeSpan]::FromMinutes(20)
              foreach ($k in $uploadHeaders.Keys) {
                if ($k -ne 'Content-Type') { [void]$client.DefaultRequestHeaders.TryAddWithoutValidation($k, $uploadHeaders[$k]) }
              }
              $stream = [System.IO.File]::OpenRead($file)
              try {
                $content = New-Object System.Net.Http.StreamContent($stream)
                $content.Headers.ContentType = New-Object System.Net.Http.Headers.MediaTypeHeaderValue('application/octet-stream')
                $content.Headers.ContentLength = $localSize
                $resp = $client.PostAsync($uploadUrl, $content).GetAwaiter().GetResult()
                if (-not $resp.IsSuccessStatusCode) {
                  $body = $resp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                  throw "Upload of $name failed: HTTP $([int]$resp.StatusCode) $($resp.ReasonPhrase) -- $body"
                }
                Write-Host "  [DONE]   $name"
              } finally {
                $stream.Dispose()
                $client.Dispose()
              }
              # Refresh release view so the next iteration sees the new asset.
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)" -Headers $headers -Method Get
            }

            if ($rel.draft) {
              Write-Host "Publishing (undraft) release id=$($rel.id) ..."
              $body = @{ draft = $false } | ConvertTo-Json -Compress
              Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)" -Headers $headers -Method Patch -Body $body -ContentType 'application/json' | Out-Null
            }
            Write-Host "Release $tag verified and published. Assets present:"
            $final = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)" -Headers $headers -Method Get
            foreach ($a in $final.assets) { Write-Host "  - $($a.name)  size=$($a.size)  state=$($a.state)" }

  # ─────────────────────────────────────────────────────────────────
  # 2026-02 — SELF-HOSTED MIRROR on the production VPS.
  #
  # MUST run in a SEPARATE Linux job because appleboy/scp-action is a
  # Docker container action and Docker container actions only run on
  # Linux runners (fix for: "Container action is only supported on
  # Linux" — that error blew up when we tried to SCP straight from the
  # Windows build runner).
  #
  # Approach: build job uploads installer + latest.yml as a GitHub
  # Actions artifact → this job downloads it on Ubuntu → SCPs to VPS.
  # Required secrets (same as deploy.yml):
  #   VPS_HOST, VPS_USER, VPS_PORT (optional), VPS_SSH_KEY
  # ─────────────────────────────────────────────────────────────────
  mirror-to-vps:
    name: Mirror to krexion.com VPS (self-hosted CDN)
    needs: build
    # 2026-01-09 — moved from ubuntu-latest to krexion-vps runner.
    # Since the runner IS the VPS, SCP+SSH is replaced by local `cp`.
    # Free forever + faster (no network round-trip).
    runs-on: [self-hosted, linux, krexion-vps]
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: read
    steps:
      # v2.1.56 — Try artifact first (fast path, no network round-trip
      # to GitHub Releases), then fall back to downloading from the
      # GitHub Release that the build job just published.
      - name: Download installer artifact from build job
        id: dl-artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Krexion-Desktop-Setup-${{ needs.build.outputs.version }}
          path: dist

      - name: Fallback — download installer from GitHub Release (via curl)
        if: steps.dl-artifact.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.build.outputs.version }}
        run: |
          set -e
          mkdir -p dist
          TAG="${{ inputs.release_tag != '' && inputs.release_tag || format('desktop-v{0}', needs.build.outputs.version) }}"
          REPO="${{ github.repository }}"
          echo "Trying GH Release tag: $TAG on $REPO"
          # 2026-01-09 — replaced 'gh' CLI usage with curl. krexion-vps
          # self-hosted runner doesn't have GitHub CLI installed and we
          # don't want to introduce that dependency. curl is universally
          # available and directly hits the GitHub REST API.
          for i in 1 2 3 4 5 6; do
            HTTP=$(curl -s -o /tmp/rel.json -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG")
            if [ "$HTTP" = "200" ]; then
              echo "  release found on attempt $i"
              break
            fi
            echo "  attempt $i: HTTP $HTTP, sleeping 10s..."
            sleep 10
          done
          # Extract asset download URLs (Krexion-Desktop-Setup-*.exe*, latest.yml)
          python3 - <<'PY' > /tmp/assets.tsv
          import json
          with open('/tmp/rel.json') as f:
              d = json.load(f)
          for a in d.get('assets', []):
              n = a['name']
              if n.startswith('Krexion-Desktop-Setup-') or n == 'latest.yml':
                  print(f"{a['url']}\t{n}")
          PY
          echo "Assets to download:"
          cat /tmp/assets.tsv
          while IFS=$'\t' read -r URL NAME; do
            [ -z "$URL" ] && continue
            echo "Downloading $NAME from $URL ..."
            curl -sL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -o "dist/$NAME" "$URL"
          done < /tmp/assets.tsv

      - name: List downloaded artifacts (debug)
        run: ls -lah dist/

      - name: Copy installer + latest.yml to VPS downloads dir (local — runner IS the VPS)
        env:
          VER: ${{ needs.build.outputs.version }}
        run: |
          set -e
          mkdir -p /opt/krexion/downloads/desktop
          cp -f dist/Krexion-Desktop-Setup-*.exe /opt/krexion/downloads/desktop/ 2>/dev/null || true
          cp -f dist/Krexion-Desktop-Setup-*.exe.blockmap /opt/krexion/downloads/desktop/ 2>/dev/null || true
          cp -f dist/latest.yml /opt/krexion/downloads/desktop/ 2>/dev/null || true
          cd /opt/krexion/downloads/desktop
          if [ -f "Krexion-Desktop-Setup-${VER}.exe" ]; then
            cp -f "Krexion-Desktop-Setup-${VER}.exe" "Krexion-Desktop-Setup-latest.exe"
          else
            echo "::warning::Expected Krexion-Desktop-Setup-${VER}.exe but not found — picking newest .exe instead"
            NEWEST=$(ls -t Krexion-Desktop-Setup-*.exe 2>/dev/null | grep -v latest | head -1)
            [ -n "$NEWEST" ] && cp -f "$NEWEST" "Krexion-Desktop-Setup-latest.exe" || true
          fi
          ls -la
          chmod -R a+r .
          echo "Self-hosted CDN updated:"
          echo "  https://krexion.com/downloads/desktop/Krexion-Desktop-Setup-latest.exe"
          echo "  https://krexion.com/downloads/desktop/latest.yml"
