name: Deploy to VPS

# 2026-01-09 v2.4.2 — REWRITTEN to use the permanent self-hosted
# GitHub Actions runner installed at /opt/krexion-runner on the
# customer VPS.  Consumes ZERO GitHub Actions minutes so this
# workflow succeeds even when the org quota is exhausted.
#
# Triggers:
#   1. Auto — every push to main
#   2. Manual — Actions tab → "Deploy to VPS" → Run workflow
#
# What it does (all locally on the VPS itself since the runner IS
# the VPS):
#   1. Check out the latest code into the runner's workspace
#   2. Rebuild Krexion-User-Package.zip
#   3. rsync workspace → /opt/krexion/ (excludes .env / caches / builds)
#   4. Disk-space self-heal (removes stale caches + dangling docker
#      images so a full rebuild always has room)
#   5. docker compose build --no-cache backend frontend
#   6. docker compose up -d backend frontend
#   7. Health check + version report

on:
  push:
    branches: [main]
    paths-ignore:
      # CI-only edits should not cancel/restart an in-flight VPS deploy.
      - '.github/workflows/build-electron-desktop.yml'
      - '.github/workflows/build-windows-release.yml'
      - '.github/workflows/emergency-vps-runner-recovery.yml'
      - '.github/workflows/cdn-sync.yml'
      - '.github/workflows/recover-services.yml'
      - '.github/workflows/fix-caddy.yml'
      - '.github/workflows/recover-caddy.yml'
  workflow_dispatch:

# Only one deploy at a time — latest push wins so stacked 2.6.50/51/52
# deploys don't race; customer always gets the newest main.
concurrency:
  group: krexion-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync source + rebuild containers
    runs-on: [self-hosted, krexion-vps]
    # 90 min — docker no-cache can exceed 45m on busy VPS.
    timeout-minutes: 90

    steps:
      - name: Checkout code via git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          SHA="${{ github.sha }}"
          if [ ! -d .git ]; then
            git init
            git remote add origin "$REPO"
          else
            git remote set-url origin "$REPO"
          fi
          git fetch --force origin "$SHA"
          git checkout --force --detach "$SHA"
          git reset --hard "$SHA"
          echo "Checked out $SHA"

      - name: Rebuild Krexion-User-Package.zip
        run: |
          if [ -d "Krexion-User-Package" ]; then
            command -v zip >/dev/null || (apt-get update -qq && apt-get install -y -qq zip)
            rm -f frontend/public/Krexion-User-Package.zip
            ( cd Krexion-User-Package && zip -r ../frontend/public/Krexion-User-Package.zip . -x "*.DS_Store" )
            ls -la frontend/public/Krexion-User-Package.zip
            sha256sum frontend/public/Krexion-User-Package.zip
          fi

      - name: rsync workspace → /opt/krexion/ (local, no SSH)
        run: |
          command -v rsync >/dev/null || (apt-get update -qq && apt-get install -y -qq rsync)
          rsync -avzr --delete \
            --exclude='.env' --exclude='node_modules' --exclude='__pycache__' \
            --exclude='*.pyc' --exclude='.git' --exclude='build' --exclude='dist' \
            --exclude='_backup_*' --exclude='visual_recorder_sessions' \
            --exclude='uploads' --exclude='form_filler_screenshots' \
            --exclude='*.zip' --exclude='downloads' \
            --exclude-from='.deployignore' \
            ./ /opt/krexion/
          echo "→ Source synced to /opt/krexion/"

      - name: Disk-space self-heal
        run: |
          echo ">> Disk BEFORE cleanup"
          df -h / /var/lib/docker 2>/dev/null | head -5
          # Remove stale caches + dangling docker artifacts (bounded)
          rm -rf /opt/krexion/backend/real_user_traffic_results/*.mp4 2>/dev/null || true
          rm -rf /opt/krexion/backend/form_filler_screenshots/* 2>/dev/null || true
          rm -rf /opt/krexion/backend/visual_recorder_sessions/*/screenshots 2>/dev/null || true
          if [ -d /opt/krexion-runner/_diag ]; then
            echo ">> Trimming krexion-runner _diag logs..."
            find /opt/krexion-runner/_diag -type f -name '*.log' -mtime +1 -delete 2>/dev/null || true
            find /opt/krexion-runner/_diag -type f -name '*.log' -size +20M -delete 2>/dev/null || true
          fi
          rm -rf /opt/krexion-runner/_work/_temp/* 2>/dev/null || true
          docker image prune -f 2>&1 | tail -2 || true
          docker builder prune -f 2>&1 | tail -2 || true
          # 2026-02 v2.6.21 — aggressive builder cache trim when the
          # host has less than 15 GB free. Prior deploys (v2.6.19/20)
          # failed at `docker compose build --no-cache` with cryptic
          # exit codes; adding this second-pass prune ensures the
          # builder always has enough working space even on tight
          # VPS disks. `--keep-storage 5GB` keeps just enough hot
          # cache for iterative rebuilds while freeing the rest.
          FREE_GB=$(df --output=avail -BG / 2>/dev/null | tail -1 | tr -dc '0-9')
          if [ -n "$FREE_GB" ] && [ "$FREE_GB" -lt 15 ]; then
            echo ">> Disk under 15GB free — running aggressive builder prune"
            docker builder prune -af --keep-storage 5GB 2>&1 | tail -3 || true
            docker system prune -f 2>&1 | tail -2 || true
          fi
          # Extra pass when critically low — mongo journal + image layers
          # need headroom or healthchecks flip to unhealthy during up.
          if [ -n "$FREE_GB" ] && [ "$FREE_GB" -lt 6 ]; then
            echo ">> Disk under 6GB free — pruning unused images/volumes carefully"
            docker image prune -af 2>&1 | tail -3 || true
            docker builder prune -af --keep-storage 2GB 2>&1 | tail -3 || true
          fi
          echo ">> Disk AFTER cleanup"
          df -h / /var/lib/docker 2>/dev/null | head -5

      - name: Detect compose file
        id: compose
        run: |
          cd /opt/krexion
          for f in docker-compose.prod.yml docker-compose.production.yml docker-compose.yml compose.yml; do
            if [ -f "$f" ]; then
              echo "compose_file=$f" >> $GITHUB_OUTPUT
              echo "→ Using $f"
              exit 0
            fi
          done
          echo "ERROR: no docker-compose file found in /opt/krexion"
          ls -la
          exit 1

      - name: Docker build --no-cache (backend + frontend)
        env:
          COMPOSE_FILE: ${{ steps.compose.outputs.compose_file }}
        run: |
          cd /opt/krexion
          export KREXION_VERSION="$(tr -d ' \n\r' < backend/VERSION)"
          echo ">> Building backend + frontend with --no-cache (UI version=$KREXION_VERSION)..."
          docker compose -f "$COMPOSE_FILE" build --no-cache backend
          docker compose -f "$COMPOSE_FILE" build --no-cache frontend

      - name: Docker up
        env:
          COMPOSE_FILE: ${{ steps.compose.outputs.compose_file }}
        run: |
          cd /opt/krexion
          set -e

          mongo_status() {
            docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' krexion-mongo 2>/dev/null || echo missing
          }

          mongo_ping_ok() {
            docker exec krexion-mongo mongosh --quiet --eval 'quit(db.runCommand({ping:1}).ok ? 0 : 2)' >/dev/null 2>&1
          }

          echo ">> Bringing mongo up first (backend depends on healthy mongo)..."
          docker compose -f "$COMPOSE_FILE" up -d mongo

          healthy=0
          for i in $(seq 1 45); do
            st=$(mongo_status)
            echo "  mongo status=$st (attempt $i/45)"
            if [ "$st" = "healthy" ]; then
              healthy=1
              break
            fi
            # Heal stuck/unhealthy/exited mongo without wiping the data volume
            if [ "$st" = "unhealthy" ] || [ "$st" = "exited" ] || [ "$st" = "dead" ] || [ "$st" = "missing" ]; then
              if [ $((i % 6)) -eq 0 ]; then
                echo ">> Healing mongo (restart / recreate, volume preserved)..."
                docker compose -f "$COMPOSE_FILE" restart mongo || true
                sleep 8
                st2=$(mongo_status)
                if [ "$st2" = "unhealthy" ] || [ "$st2" = "exited" ] || [ "$st2" = "dead" ] || [ "$st2" = "missing" ]; then
                  docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps mongo || true
                fi
              fi
            fi
            # Live ping can succeed even while health label is still catching up
            if mongo_ping_ok; then
              echo "  mongosh ping OK"
              if [ "$st" = "healthy" ] || [ "$i" -ge 12 ]; then
                healthy=1
                break
              fi
            fi
            sleep 3
          done

          if [ "$healthy" != "1" ]; then
            echo "::group::Mongo diagnostics (deploy blocked)"
            docker compose -f "$COMPOSE_FILE" ps mongo || true
            docker logs --no-color --tail=150 krexion-mongo || true
            df -h / /var/lib/docker 2>/dev/null | head -5 || true
            free -h || true
            echo "::endgroup::"
            exit 1
          fi

          echo ">> Mongo healthy — starting backend + frontend..."
          if ! docker compose -f "$COMPOSE_FILE" up -d backend frontend; then
            echo "::group::Backend startup diagnostics"
            docker compose -f "$COMPOSE_FILE" ps || true
            docker compose -f "$COMPOSE_FILE" logs --no-color --tail=200 backend || true
            docker logs --no-color --tail=120 krexion-mongo || true
            echo "::endgroup::"
            # Last resort: if mongo ping works, start deps without waiting on label
            if mongo_ping_ok; then
              echo ">> Retrying backend/frontend with --no-deps (mongo ping OK)..."
              docker compose -f "$COMPOSE_FILE" up -d --no-deps backend frontend
            else
              exit 1
            fi
          fi
          echo ">> Containers started"

      - name: Health check + version report
        env:
          COMPOSE_FILE: ${{ steps.compose.outputs.compose_file }}
        run: |
          cd /opt/krexion
          echo ">> Waiting up to 60s for backend health..."
          for i in $(seq 1 12); do
            sleep 5
            if curl -sf --max-time 3 http://localhost:8001/api/system/version >/dev/null 2>&1; then
              CUR=$(curl -s http://localhost:8001/api/system/version | python3 -c "import sys,json;print(json.load(sys.stdin).get('version','?'))" 2>/dev/null || echo "?")
              echo "  ✅ Backend up · version=$CUR"
              break
            fi
            echo "  ...still starting (attempt $i/12)"
          done
          echo ""
          echo "===================================================="
          echo "  Container status:"
          docker compose -f "$COMPOSE_FILE" ps
          echo "===================================================="
          echo "  Backend VERSION file: $(cat backend/VERSION 2>/dev/null || echo '?')"
          echo "  Public endpoint check:"
          curl -sf --max-time 5 https://krexion.com/api/system/version || echo "(public endpoint check failed — check nginx/cloudflare)"
          echo "===================================================="

      - name: Sync download page release record (auto)
        continue-on-error: true
        env:
          COMPOSE_FILE: ${{ steps.compose.outputs.compose_file }}
        run: |
          cd /opt/krexion
          echo ">> Syncing app_releases row for download page / update banner..."
          curl -sf -X POST http://localhost:8001/api/system/sync-deploy-release \
            && echo "  ✅ Release record synced from backend/VERSION" \
            || echo "  WARN: release sync skipped (endpoint may need redeploy first)"

      - name: Publish native UI sync zip (optional)
        continue-on-error: true
        timeout-minutes: 8
        env:
          COMPOSE_FILE: ${{ steps.compose.outputs.compose_file }}
        run: |
          cd /opt/krexion
          VERSION=$(tr -d ' \n\r' < backend/VERSION)
          mkdir -p downloads/ui
          command -v zip >/dev/null || (apt-get update -qq && apt-get install -y -qq zip)
          EXPORT=/tmp/krexion-ui-export
          rm -rf "$EXPORT" && mkdir -p "$EXPORT"
          if ! docker compose -f "$COMPOSE_FILE" cp frontend:/usr/share/nginx/html/. "$EXPORT/"; then
            echo "WARN: could not copy live frontend files — skipping UI sync zip"
            exit 0
          fi
          # CRITICAL: frontend container bind-mounts /downloads (600MB+ installers).
          # Never zip that into krexion-ui-*.zip — broke native UI sync (~25GB zips).
          rm -rf "$EXPORT/downloads"
          if ! python3 scripts/stamp-frontend-build.py --dir "$EXPORT"; then
            echo "WARN: stamp verify failed — writing version-only marker"
            printf '{"version":"%s"}\n' "$VERSION" > "$EXPORT/build-version.json"
          fi
          rm -f "downloads/ui/krexion-ui-${VERSION}.zip"
          (cd "$EXPORT" && zip -qr "/opt/krexion/downloads/ui/krexion-ui-${VERSION}.zip" .)
          ZIP_BYTES=$(stat -c%s "downloads/ui/krexion-ui-${VERSION}.zip" 2>/dev/null || stat -f%z "downloads/ui/krexion-ui-${VERSION}.zip")
          if [ "$ZIP_BYTES" -gt 104857600 ]; then
            echo "::error::UI zip too large (${ZIP_BYTES} bytes) — likely included downloads/ by mistake"
            rm -f "downloads/ui/krexion-ui-${VERSION}.zip"
            exit 1
          fi
          ls -la "downloads/ui/krexion-ui-${VERSION}.zip"
          sha256sum "downloads/ui/krexion-ui-${VERSION}.zip"
          echo "  Deploy complete: $(date -u +%FT%TZ)"
          echo "===================================================="

      # Installer CDN is synced by .github/workflows/cdn-sync.yml (ubuntu + SCP).
      # Keeping deploy focused on source + containers avoids 600MB+ downloads on VPS.
