name: Windows Disk Emergency Clean

# Minimal job (no checkout) so it can still start when C: is nearly full.
# Run via workflow_dispatch before Native rebuilds after disk-full failures.

on:
  workflow_dispatch:

concurrency:
  group: krexion-windows-disk-clean
  cancel-in-progress: false

jobs:
  clean:
    name: Nuclear clean C: on krexion-windows
    runs-on: [self-hosted, windows, krexion-windows]
    timeout-minutes: 30
    steps:
      - name: Nuclear disk clean (no checkout)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          function Show-Free([string]$label) {
            $d = Get-PSDrive -Name C -ErrorAction SilentlyContinue
            if ($d) {
              $gb = [math]::Round(($d.Free / 1GB), 2)
              Write-Host ("{0}: C: free {1} GB" -f $label, $gb)
              return $gb
            }
            return 0
          }
          $before = Show-Free 'BEFORE'

          # Wipe runner diag logs entirely (pages/*.log caused prior failures)
          @(
            'C:\krexion-runner\_diag',
            'C:\actions-runner\_diag',
            "$env:USERPROFILE\actions-runner\_diag"
          ) | ForEach-Object {
            if (Test-Path $_) {
              Remove-Item "$_\*" -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Wiped $_"
            }
          }

          # Drop all prior job workspaces except anything locked
          foreach ($work in @('C:\krexion-runner\_work', 'C:\actions-runner\_work')) {
            if (Test-Path $work) {
              Get-ChildItem $work -Force -ErrorAction SilentlyContinue | ForEach-Object {
                if ($_.Name -in @('_tool', '_update', '_actions')) { return }
                Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
              }
              Write-Host "Pruned $work"
            }
          }

          # Full CI cache wipe (rebuilds are cheaper than disk-full)
          if (Test-Path 'C:\krexion-ci-cache') {
            Remove-Item 'C:\krexion-ci-cache\*' -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host 'Wiped C:\krexion-ci-cache'
          }

          @(
            'C:\Windows\Temp',
            "$env:TEMP",
            "$env:LOCALAPPDATA\Temp",
            "$env:LOCALAPPDATA\pip\Cache",
            "$env:USERPROFILE\.cache\pip",
            "$env:LOCALAPPDATA\npm-cache",
            "$env:LOCALAPPDATA\Yarn\Cache",
            "$env:USERPROFILE\AppData\Local\ms-playwright",
            "$env:USERPROFILE\.cache\ms-playwright"
          ) | ForEach-Object {
            if (Test-Path $_) {
              try { Remove-Item "$_\*" -Recurse -Force -ErrorAction SilentlyContinue } catch {}
              Write-Host "Cleared $_"
            }
          }

          try { Clear-RecycleBin -Force -ErrorAction SilentlyContinue } catch {}

          $after = Show-Free 'AFTER'
          if ($after -lt 5.0) {
            Write-Host "::error::C: still under 5 GB free after nuclear clean ($after GB). Free disk on the Windows runner PC manually."
            exit 1
          }
          Write-Host "Emergency disk clean OK ($after GB free)"
