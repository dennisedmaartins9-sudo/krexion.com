[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Default `pytest tests/` skips live-e2e / env-broken modules.
# Official ship gate: bash scripts/run_ship_gate.sh  (test_v2_* + browser_profile)
addopts =
    -ra
    --ignore=tests/test_admin_account_models.py
    --ignore=tests/test_ai_automation_generator.py
    --ignore=tests/test_clicks_filter_alignment.py
    --ignore=tests/test_desktop_stats_fix.py
    --ignore=tests/test_identity_store_e2e.py
    --ignore=tests/test_iteration10_adspower_test_and_unique_ips.py
    --ignore=tests/test_iteration11_rut_tunnel_retry.py
    --ignore=tests/test_iteration14_rut_engine_status.py
    --ignore=tests/test_iteration15_rut_engine_prewarm.py
    --ignore=tests/test_iteration16_os_fold_and_captcha.py
    --ignore=tests/test_iteration17_per_use_deletion.py
    --ignore=tests/test_iteration2_smoke.py
    --ignore=tests/test_iteration3_restore_smoke.py
    --ignore=tests/test_iteration4_hardware_profile.py
    --ignore=tests/test_iteration4_rut_async_submit.py
    --ignore=tests/test_iteration5_new_features.py
    --ignore=tests/test_iteration6_clone_smoke.py
    --ignore=tests/test_iteration6_rut_retry_and_preparing.py
    --ignore=tests/test_iteration6_screenshot.py
    --ignore=tests/test_iteration7_crypto_payment.py
    --ignore=tests/test_iteration7_visual_recorder_async.py
    --ignore=tests/test_iteration8_concurrency_and_consume.py
    --ignore=tests/test_iteration8_rut_pending_leads.py
    --ignore=tests/test_iteration9_rut_pending_and_state_match.py
    --ignore=tests/test_native_installer_flow.py
    --ignore=tests/test_native_mem_limit_fallback.py
    --ignore=tests/test_referer_wire.py
    --ignore=tests/test_rut_iteration4.py
    --ignore=tests/test_rut_referrer_bugs.py
    --ignore=tests/test_smoke_trackmaster.py
    --ignore=tests/test_strict_mode_gate.py
    --ignore=tests/test_team_offer_ip_claims.py
    --ignore=tests/demo_rut_test.py
    --ignore=tests/test_proxy_ips_feature.py
